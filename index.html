<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Rokon Workspace</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1788927926/ybnqakprht9dilzx8ox1.png" />

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- SF Symbols -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            --bg-primary: #f8f9fa;
            --bg-surface: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.82);
            --bg-glass-hover: rgba(255, 255, 255, 0.95);
            --text-primary: #0a1a2e;
            --text-secondary: #4a5a72;
            --text-muted: #8a9eb5;
            --accent: #0066ff;
            --accent-hover: #0052cc;
            --radius-xl: 32px;
            --radius-lg: 24px;
            --radius-md: 18px;
            --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.06);
            --transition: 0.28s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0a0f1c;
                --bg-surface: #121827;
                --bg-glass: rgba(18, 24, 39, 0.82);
                --bg-glass-hover: rgba(18, 24, 39, 0.95);
                --text-primary: #f0f4f9;
                --text-secondary: #a1b5d1;
                --text-muted: #7a8eb8;
            }
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-container {
            width: 100%;
            max-width: 1280px;
            background: var(--bg-surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 92vh;
        }

        /* Liquid Glass effect on every card */
        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: var(--shadow-glass);
            transition: var(--transition);
        }
        .glass:hover { box-shadow: 0 12px 40px rgba(0,0,0,0.07); }

        /* All existing classes kept + upgraded */
        .login-box, .dashboard-header, .col, .work-section, .modal-box,
        .chat-input-area, .file-toolbar, .file-upload-container,
        .work-form, .modal-box .modal-input-group {
            background: var(--bg-glass) !important;
            backdrop-filter: blur(32px) !important;
            -webkit-backdrop-filter: blur(32px) !important;
            border: 1px solid rgba(255,255,255,0.3) !important;
        }

        /* Enhanced buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #0044cc);
            color: #fff;
            box-shadow: 0 4px 16px rgba(0,102,255,0.25);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,102,255,0.35); }

        /* Header */
        .dashboard-header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dashboard-header .brand h2 {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        /* Chat & File list */
        .chat-messages, .file-list, .work-list {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(20px);
        }

        /* Progress bar */
        .upload-progress-wrap progress::-webkit-progress-value {
            background: linear-gradient(90deg, var(--accent), #0066ff);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,102,255,0.3);
            border-radius: 20px;
        }

        /* Modal */
        .modal-box {
            background: var(--bg-surface);
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 30px 80px rgba(0,0,0,0.12);
        }
        .modal-box .modal-header {
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">

        <!-- LOADING -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <p>Loading Rokon Workspace…</p>
        </div>

        <!-- LOGIN -->
        <div id="loginScreen" class="active" style="background: linear-gradient(145deg, #0a0f1c, #1a2538);">
            <img class="login-logo" src="https://res.cloudinary.com/zmoyykj7/image/upload/v1788927927/eoftqjd03epnna71chma.png" alt="Rokon Logo" />
            <div class="login-box glass">
                <input type="email" id="loginEmail" placeholder="Email address" />
                <input type="password" id="loginPassword" placeholder="Password" />
                <div class="btn-group">
                    <button class="btn-primary" id="loginBtn">Sign In</button>
                    <button class="btn-secondary" id="registerBtn">Register</button>
                </div>
                <div id="loginError" class="login-error"></div>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard">
            <div class="dashboard-header glass">
                <div class="brand">
                    <img src="https://res.cloudinary.com/zmoyykj7/image/upload/v1788927927/eoftqjd03epnna71chma.png" alt="Rokon Logo" style="height:34px;" />
                    <h2>Rokon <span class="live-badge" style="background:rgba(0,102,255,0.15);color:var(--accent);padding:3px 12px;border-radius:9999px;font-size:0.65rem;font-weight:700;">Live</span></h2>
                </div>
                <div class="user-info">
                    <span class="email-badge" id="userEmailDisplay">user@example.com</span>
                    <span class="balance-badge" id="balanceDisplay">Balance: $0.00</span>
                    <button class="btn-settings" id="settingsBtn"><i class="fas fa-cog"></i></button>
                    <button class="btn-logout" id="logoutBtn">Logout</button>
                </div>
            </div>

            <div class="dashboard-body">
                <div class="main-row glass">
                    <!-- Chat -->
                    <div class="col glass">
                        <div class="col-header">
                            <span>💬 Live Chat</span>
                            <span class="badge">real‑time</span>
                        </div>
                        <div class="chat-messages" id="chatMessages"></div>
                        <div class="chat-input-area">
                            <input type="text" id="chatInput" placeholder="Type a message…" />
                            <button id="sendChatBtn">Send</button>
                        </div>
                    </div>

                    <!-- Files -->
                    <div class="col glass">
                        <div class="col-header">
                            <span>📎 Shared Files</span>
                            <span class="badge" id="fileCount">0</span>
                        </div>
                        <div class="file-toolbar">
                            <label><input type="checkbox" id="selectAllCheckbox" /> Select All</label>
                            <button id="deleteSelectedBtn" class="btn-delete-selected">Delete Selected</button>
                        </div>
                        <div class="file-list" id="fileList"></div>

                        <div class="file-upload-container">
                            <div class="upload-progress-wrap" id="docProgressWrap" style="display:none;">
                                <progress id="docProgressBar"></progress>
                                <span class="progress-text" id="docProgressText">0%</span>
                            </div>
                            <!-- Image & Doc upload rows same as before -->
                            <div class="upload-row">
                                <label class="file-label" id="imageLabel"><i class="fas fa-image"></i> <span>Choose image…</span></label>
                                <button id="uploadImageBtn" class="btn-img-upload">Upload</button>
                            </div>
                            <div class="upload-row">
                                <label class="file-label" id="docLabel"><i class="fas fa-file-alt"></i> <span>Choose document…</span></label>
                                <button id="uploadDocumentBtn" class="btn-doc-upload">Upload Doc</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Work Section -->
                <div class="work-section glass" id="workSection">
                    <div class="work-header">
                        <span>📋 Work History</span>
                        <span class="badge" id="workCount">0</span>
                    </div>
                    <div class="work-form" id="workForm">
                        <input type="date" id="workDate" />
                        <input type="text" id="workName" placeholder="Work name" />
                        <input type="number" id="workAmount" placeholder="Amount (৳)" />
                        <button id="addWorkBtn">Add Work</button>
                    </div>
                    <div class="work-list" id="workList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL + TOAST (same as before) -->
    <!-- ... (modal-overlay, toast-container kept exactly same) ... -->

</body>
</html>
