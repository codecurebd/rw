<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Rokon Workspace</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1788927926/ybnqakprht9dilzx8ox1.png" />

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            --bg-primary: #f8f9fa;
            --bg-surface: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.82);
            --bg-glass-hover: rgba(255, 255, 255, 0.95);
            --text-primary: #0a1a2e;
            --text-secondary: #4a5a72;
            --text-muted: #8a9eb5;
            --accent: #0066ff;
            --accent-hover: #0052cc;
            --radius-xl: 32px;
            --radius-lg: 24px;
            --radius-md: 18px;
            --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.06);
            --transition: 0.28s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0a0f1c;
                --bg-surface: #121827;
                --bg-glass: rgba(18, 24, 39, 0.82);
                --bg-glass-hover: rgba(18, 24, 39, 0.95);
                --text-primary: #f0f4f9;
                --text-secondary: #a1b5d1;
                --text-muted: #7a8eb8;
            }
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-container {
            width: 100%;
            max-width: 1280px;
            background: var(--bg-surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 92vh;
        }

        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: var(--shadow-glass);
            transition: var(--transition);
        }
        .glass:hover { box-shadow: 0 12px 40px rgba(0,0,0,0.07); }

        .login-box, .dashboard-header, .col, .work-section, .modal-box,
        .chat-input-area, .file-toolbar, .file-upload-container,
        .work-form, .modal-box .modal-input-group {
            background: var(--bg-glass) !important;
            backdrop-filter: blur(32px) !important;
            -webkit-backdrop-filter: blur(32px) !important;
            border: 1px solid rgba(255,255,255,0.3) !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #0044cc);
            color: #fff;
            box-shadow: 0 4px 16px rgba(0,102,255,0.25);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,102,255,0.35); }

        .dashboard-header .brand h2 {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .chat-messages, .file-list, .work-list {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(20px);
        }

        .upload-progress-wrap progress::-webkit-progress-value {
            background: linear-gradient(90deg, var(--accent), #0066ff);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,102,255,0.3);
            border-radius: 20px;
        }

        .modal-box {
            background: var(--bg-surface);
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 30px 80px rgba(0,0,0,0.12);
        }
        .modal-box .modal-header {
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">

        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <p>Loading Rokon Workspace…</p>
        </div>

        <!-- LOGIN -->
        <div id="loginScreen" class="active" style="background: linear-gradient(145deg, #0a0f1c, #1a2538);">
            <img class="login-logo" src="https://res.cloudinary.com/zmoyykj7/image/upload/v1788927927/eoftqjd03epnna71chma.png" alt="Rokon Logo" />
            <div class="login-box glass">
                <input type="email" id="loginEmail" placeholder="Email address" />
                <input type="password" id="loginPassword" placeholder="Password" />
                <div class="btn-group">
                    <button class="btn-primary" id="loginBtn">Sign In</button>
                    <button class="btn-secondary" id="registerBtn">Register</button>
                </div>
                <div id="loginError" class="login-error"></div>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard">
            <div class="dashboard-header glass">
                <div class="brand">
                    <img src="https://res.cloudinary.com/zmoyykj7/image/upload/v1788927927/eoftqjd03epnna71chma.png" alt="Rokon Logo" style="height:34px;" />
                    <h2>Rokon <span class="live-badge" style="background:rgba(0,102,255,0.15);color:var(--accent);padding:3px 12px;border-radius:9999px;font-size:0.65rem;font-weight:700;">Live</span></h2>
                </div>
                <div class="user-info">
                    <span class="email-badge" id="userEmailDisplay">user@example.com</span>
                    <span class="balance-badge" id="balanceDisplay">Balance: $0.00</span>
                    <button class="btn-settings" id="settingsBtn"><i class="fas fa-cog"></i></button>
                    <button class="btn-logout" id="logoutBtn">Logout</button>
                </div>
            </div>

            <div class="dashboard-body">
                <div class="main-row glass">
                    <!-- Chat -->
                    <div class="col glass">
                        <div class="col-header">
                            <span>💬 Live Chat</span>
                            <span class="badge">real‑time</span>
                        </div>
                        <div class="chat-messages" id="chatMessages"></div>
                        <div class="chat-input-area">
                            <input type="text" id="chatInput" placeholder="Type a message…" />
                            <button id="sendChatBtn">Send</button>
                        </div>
                    </div>

                    <!-- Files -->
                    <div class="col glass">
                        <div class="col-header">
                            <span>📎 Shared Files</span>
                            <span class="badge" id="fileCount">0</span>
                        </div>
                        <div class="file-toolbar">
                            <label><input type="checkbox" id="selectAllCheckbox" /> Select All</label>
                            <button id="deleteSelectedBtn" class="btn-delete-selected">Delete Selected</button>
                        </div>
                        <div class="file-list" id="fileList"></div>

                        <div class="file-upload-container">
                            <div class="upload-progress-wrap" id="docProgressWrap" style="display:none;">
                                <progress id="docProgressBar"></progress>
                                <span class="progress-text" id="docProgressText">0%</span>
                            </div>
                            <div class="upload-row">
                                <label class="file-label" id="imageLabel"><i class="fas fa-image"></i> <span>Choose image…</span></label>
                                <button id="uploadImageBtn" class="btn-img-upload">Upload</button>
                            </div>
                            <div class="upload-row">
                                <label class="file-label" id="docLabel"><i class="fas fa-file-alt"></i> <span>Choose document…</span></label>
                                <button id="uploadDocumentBtn" class="btn-doc-upload">Upload Doc</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Work Section -->
                <div class="work-section glass" id="workSection">
                    <div class="work-header">
                        <span>📋 Work History</span>
                        <span class="badge" id="workCount">0</span>
                    </div>
                    <div class="work-form" id="workForm">
                        <input type="date" id="workDate" />
                        <input type="text" id="workName" placeholder="Work name" />
                        <input type="number" id="workAmount" placeholder="Amount (৳)" />
                        <button id="addWorkBtn">Add Work</button>
                    </div>
                    <div class="work-list" id="workList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box" id="modalBox">
            <div class="modal-header">
                <h3 id="modalTitle"><i class="fas fa-info-circle"></i>Modal</h3>
                <button class="modal-close" id="modalCloseBtn">&times;</button>
            </div>
            <div id="modalBody" class="modal-body"></div>
            <div id="modalInputGroup" class="modal-input-group hidden">
                <label id="modalInputLabel">Type to confirm:</label>
                <input type="text" id="modalInput" placeholder="Type here…" />
                <div class="error-text" id="modalInputError">Does not match. Please try again.</div>
            </div>
            <div class="modal-actions" id="modalActions">
                <button class="btn-modal-cancel" id="modalCancelBtn">Cancel</button>
                <button class="btn-modal-primary" id="modalConfirmBtn">Confirm</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast-container"></div>

    <script>
        // ====================== FIREBASE ======================
        const firebaseConfig = {
            apiKey: "AIzaSyD-RHTu4TNjlEdH3M7O6-1HVaniVCPMEyI",
            authDomain: "rokon-workspace.firebaseapp.com",
            projectId: "rokon-workspace",
            storageBucket: "rokon-workspace.firebasestorage.app",
            messagingSenderId: "118826238702",
            appId: "1:118826238702:web:1917db220805b2012a69ff"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const CLOUDINARY_CLOUD_NAME = "zmoyykj7";
        const CLOUDINARY_UPLOAD_PRESET = "codecurebd";

        // ====================== DOM REFS ======================
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loginScreen = document.getElementById('loginScreen');
        const dashboard = document.getElementById('dashboard');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const userEmailDisplay = document.getElementById('userEmailDisplay');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const settingsBtn = document.getElementById('settingsBtn');

        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendChatBtn = document.getElementById('sendChatBtn');

        const fileList = document.getElementById('fileList');
        const fileCount = document.getElementById('fileCount');
        const selectAllCheckbox = document.getElementById('selectAllCheckbox');
        const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');

        const imageInput = document.getElementById('imageInput');
        const uploadImageBtn = document.getElementById('uploadImageBtn');
        const imageFileName = document.getElementById('imageFileName');
        const documentInput = document.getElementById('documentInput');
        const uploadDocumentBtn = document.getElementById('uploadDocumentBtn');
        const docFileName = document.getElementById('docFileName');

        const docProgressWrap = document.getElementById('docProgressWrap');
        const docProgressBar = document.getElementById('docProgressBar');
        const docProgressText = document.getElementById('docProgressText');

        const workDate = document.getElementById('workDate');
        const workName = document.getElementById('workName');
        const workAmount = document.getElementById('workAmount');
        const addWorkBtn = document.getElementById('addWorkBtn');
        const workList = document.getElementById('workList');
        const workCount = document.getElementById('workCount');

        // ====================== MODAL ======================
        const modal = document.getElementById('customModal');
        const modalBox = document.getElementById('modalBox');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalInputGroup = document.getElementById('modalInputGroup');
        const modalInput = document.getElementById('modalInput');
        const modalInputLabel = document.getElementById('modalInputLabel');
        const modalInputError = document.getElementById('modalInputError');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');

        let modalResolve = null;
        let modalReject = null;
        let modalExpectedValue = '';
        let modalCustomConfirm = null;

        function openModal(options) {
            return new Promise((resolve, reject) => {
                const {
                    title = 'Notice',
                    icon = 'fa-info-circle',
                    iconColor = 'var(--accent)',
                    message = '',
                    confirmText = 'Confirm',
                    cancelText = 'Cancel',
                    showCancel = true,
                    input = false,
                    inputLabel = 'Type to confirm:',
                    inputPlaceholder = 'Type here…',
                    expectedValue = '',
                    danger = false,
                    success = false,
                    warning = false,
                    customConfirm = null,
                } = options;

                modalResolve = resolve;
                modalReject = reject;
                modalCustomConfirm = customConfirm;

                let iconHtml = '';
                if (icon) {
                    let colorClass = '';
                    if (danger) colorClass = 'danger';
                    else if (success) colorClass = 'success';
                    else if (warning) colorClass = 'warning';
                    iconHtml = `<div class="modal-icon ${colorClass}"><i class="fas ${icon}"></i></div>`;
                }

                modalTitle.innerHTML = `<i class="fas ${icon}" style="color:${iconColor};"></i> ${title}`;
                modalBody.innerHTML = iconHtml + (message || '');

                if (input) {
                    modalInputGroup.classList.remove('hidden');
                    modalInputLabel.textContent = inputLabel;
                    modalInput.placeholder = inputPlaceholder;
                    modalInput.value = '';
                    modalInput.classList.remove('error');
                    modalInputError.classList.remove('show');
                    modalExpectedValue = expectedValue || '';
                    modalConfirmBtn.disabled = true;
                    modalInput.focus();
                    modalInput.addEventListener('input', onModalInput);
                } else {
                    modalInputGroup.classList.add('hidden');
                    modalExpectedValue = '';
                    modalConfirmBtn.disabled = false;
                }

                modalConfirmBtn.textContent = confirmText;
                modalCancelBtn.textContent = cancelText;
                modalCancelBtn.style.display = showCancel ? '' : 'none';

                if (danger) {
                    modalConfirmBtn.className = 'btn-modal-danger';
                } else {
                    modalConfirmBtn.className = 'btn-modal-primary';
                }

                const handleConfirm = () => {
                    if (modalCustomConfirm) {
                        const result = modalCustomConfirm();
                        if (result !== false) {
                            resolve(result);
                            closeModal();
                        }
                        return;
                    }
                    if (input) {
                        const val = modalInput.value.trim();
                        if (expectedValue && val.toLowerCase() !== expectedValue.toLowerCase()) {
                            modalInput.classList.add('error');
                            modalInputError.classList.add('show');
                            return;
                        }
                        modalInput.classList.remove('error');
                        modalInputError.classList.remove('show');
                        resolve(val);
                    } else {
                        resolve(true);
                    }
                    closeModal();
                };

                const handleCancel = () => {
                    resolve(false);
                    closeModal();
                };

                modal._onConfirm = handleConfirm;
                modal._onCancel = handleCancel;
                modal._onClose = handleCancel;

                modalConfirmBtn.onclick = modal._onConfirm;
                modalCancelBtn.onclick = modal._onCancel;
                modalCloseBtn.onclick = modal._onClose;
                modal.onclick = (e) => { if (e.target === modal) modal._onClose(); };
                modalInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') modal._onConfirm();
                    if (e.key === 'Escape') modal._onCancel();
                });

                modal.classList.add('open');
                document.body.style.overflow = 'hidden';
            });
        }

        function onModalInput() {
            const val = modalInput.value.trim();
            if (modalExpectedValue) {
                const match = val.toLowerCase() === modalExpectedValue.toLowerCase();
                modalConfirmBtn.disabled = !match;
                if (val.length > 0 && !match) {
                    modalInput.classList.add('error');
                    modalInputError.classList.add('show');
                } else {
                    modalInput.classList.remove('error');
                    modalInputError.classList.remove('show');
                }
            } else {
                modalConfirmBtn.disabled = val.length === 0;
            }
        }

        function closeModal() {
            modal.classList.remove('open');
            document.body.style.overflow = '';
            modalInput.value = '';
            modalInput.classList.remove('error');
            modalInputError.classList.remove('show');
            modalConfirmBtn.disabled = false;
            modalInput.removeEventListener('input', onModalInput);
            modalResolve = null;
            modalReject = null;
            modalCustomConfirm = null;
        }

        // ====================== TOAST ======================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.info}"></i>
                <span>${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 400);
            }, 4500);
        }

        // ====================== LOADING ======================
        function showLoading() { loadingOverlay.classList.add('active'); }
        function hideLoading() { loadingOverlay.classList.remove('active'); }

        // ====================== AUTH ======================
        let currentUser = null;
        let currentUserData = null;

        auth.onAuthStateChanged(async user => {
            if (user) {
                currentUser = user;
                userEmailDisplay.textContent = user.email;
                await ensureUserDocument(user.uid, user.email);
                await loadUserData(user.uid);
                showDashboard();
                startRealtimeListeners();
                hideLoading();
            } else {
                currentUser = null;
                currentUserData = null;
                showLogin();
                detachListeners();
                hideLoading();
            }
        });

        async function ensureUserDocument(uid, email) {
            const docRef = db.collection('users').doc(uid);
            const snap = await docRef.get();
            if (!snap.exists) {
                await docRef.set({ balance: 0, percentage: 100, email: email || '', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
            } else {
                const data = snap.data();
                if (!data.email || data.email !== email) await docRef.update({ email: email || '' });
            }
        }

        async function loadUserData(uid) {
            const docRef = db.collection('users').doc(uid);
            const snap = await docRef.get();
            if (snap.exists) {
                currentUserData = snap.data();
                updateBalanceDisplay(currentUserData.balance || 0);
            } else {
                currentUserData = { balance: 0, percentage: 100 };
                updateBalanceDisplay(0);
            }
        }

        function updateBalanceDisplay(balance) {
            balanceDisplay.textContent = `Balance: $${balance.toFixed(2)}`;
        }

        // ====================== SETTINGS ======================
        settingsBtn.addEventListener('click', async () => {
            if (!currentUser) return;
            try {
                const usersSnapshot = await db.collection('users').get();
                if (usersSnapshot.empty) { showToast('No users found.', 'warning'); return; }

                const users = [];
                usersSnapshot.forEach(doc => {
                    const data = doc.data();
                    users.push({ id: doc.id, email: data.email || doc.id, percentage: data.percentage || 100 });
                });

                let userListHtml = `<div class="user-list-container">`;
                users.forEach(user => {
                    userListHtml += `
                        <div class="user-row">
                            <span class="user-email" title="${escapeHtml(user.email)}">${escapeHtml(user.email)}</span>
                            <input type="number" class="user-percent-input" data-id="${user.id}" value="${user.percentage}" min="0" max="100" step="1" />
                            <span class="user-percent-label">%</span>
                            <span class="user-current">${user.percentage}%</span>
                        </div>
                    `;
                });
                userListHtml += `</div><div class="info-note"><i class="fas fa-info-circle"></i> Each user's percentage determines their share of every new work entry. Changes take effect for future work entries only.</div>`;

                const result = await openModal({
                    title: 'User Earning Percentages',
                    icon: 'fa-users-cog',
                    iconColor: 'var(--accent)',
                    message: userListHtml,
                    confirmText: 'Save All',
                    danger: false,
                    showCancel: true,
                    customConfirm: () => {
                        const inputs = document.querySelectorAll('.user-percent-input');
                        const updates = {};
                        let hasError = false;
                        inputs.forEach(input => {
                            const val = parseFloat(input.value);
                            if (isNaN(val) || val < 0 || val > 100) {
                                showToast(`Invalid percentage (must be 0-100)`, 'error');
                                hasError = true;
                                return;
                            }
                            updates[input.dataset.id] = val;
                        });
                        if (hasError) return false;
                        return updates;
                    }
                });

                if (result !== false && typeof result === 'object') {
                    try {
                        const batch = db.batch();
                        for (const [userId, percent] of Object.entries(result)) {
                            const userRef = db.collection('users').doc(userId);
                            batch.update(userRef, { percentage: percent });
                        }
                        await batch.commit();
                        showToast('All user percentages updated successfully!', 'success');
                        await loadUserData(currentUser.uid);
                    } catch (err) {
                        showToast('Failed to update percentages: ' + err.message, 'error');
                    }
                }
            } catch (err) {
                showToast('Error loading users: ' + err.message, 'error');
            }
        });

        // ====================== LOGIN / LOGOUT ======================
        function showLogin() {
            loginScreen.classList.add('active');
            dashboard.classList.remove('active');
            loginError.textContent = '';
        }

        function showDashboard() {
            loginScreen.classList.remove('active');
            dashboard.classList.add('active');
        }

        loginBtn.addEventListener('click', () => {
            const email = loginEmail.value.trim();
            const pass = loginPassword.value.trim();
            if (!email || !pass) {
                loginError.textContent = 'Please enter email and password.';
                return;
            }
            showLoading();
            auth.signInWithEmailAndPassword(email, pass).catch(err => { loginError.textContent = err.message; hideLoading(); });
        });

        registerBtn.addEventListener('click', () => {
            const email = loginEmail.value.trim();
            const pass = loginPassword.value.trim();
            if (!email || !pass) {
                loginError.textContent = 'Please enter email and password.';
                return;
            }
            showLoading();
            auth.createUserWithEmailAndPassword(email, pass).catch(err => { loginError.textContent = err.message; hideLoading(); });
        });

        logoutBtn.addEventListener('click', () => {
            auth.signOut();
            showToast('Logged out', 'info');
        });

        // ====================== REALTIME LISTENERS ======================
        let chatUnsubscribe = null;
        let fileUnsubscribe = null;
        let workUnsubscribe = null;
        let userUnsubscribe = null;

        function startRealtimeListeners() {
            if (chatUnsubscribe) chatUnsubscribe();
            chatUnsubscribe = db.collection('messages').orderBy('timestamp', 'asc').onSnapshot(snapshot => {
                const container = chatMessages;
                container.innerHTML = '';
                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-comment-dots"></i>No messages yet.</div>';
                    return;
                }
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const msgDiv = document.createElement('div');
                    msgDiv.classList.add('message');
                    msgDiv.classList.add(data.uid === currentUser.uid ? 'self' : 'other');
                    msgDiv.innerHTML = `<div>${escapeHtml(data.text)}</div><div class="meta"><span>${escapeHtml(data.email || 'unknown')}</span><span>${data.timestamp ? new Date(data.timestamp.toMillis()).toLocaleTimeString() : ''}</span></div>`;
                    container.appendChild(msgDiv);
                });
                container.scrollTop = container.scrollHeight;
            }, console.error);

            if (fileUnsubscribe) fileUnsubscribe();
            fileUnsubscribe = db.collection('files').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
                const container = fileList;
                container.innerHTML = '';
                fileCount.textContent = snapshot.size;
                selectAllCheckbox.checked = false;
                updateDeleteSelectedButtonState();

                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-folder-open"></i>No files shared yet.</div>';
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const item = document.createElement('div');
                    item.classList.add('file-item');
                    const sizeStr = data.size ? (data.size / 1024).toFixed(1) + ' KB' : '';
                    const icon = data.type === 'image' ? '🖼️' : '📄';
                    const isChunked = data.totalChunks && data.totalChunks > 0;

                    let downloadHtml = '';
                    if (isChunked) {
                        downloadHtml = `<button class="download-btn" onclick="downloadChunkedFile('${doc.id}')">Download</button>`;
                    } else {
                        const url = data.url || '#';
                        downloadHtml = `<a href="${escapeHtml(url)}" download="${escapeHtml(data.name)}" target="_blank">Download</a>`;
                    }

                    item.innerHTML = `
                        <div class="file-info">
                            <input type="checkbox" class="file-checkbox" data-id="${doc.id}">
                            <span class="file-icon">${icon}</span>
                            <span class="file-name" title="${escapeHtml(data.name)}">${escapeHtml(data.name)}</span>
                            <span class="file-size">${sizeStr}</span>
                            ${isChunked ? `<span class="file-size parts">(${data.totalChunks} parts)</span>` : ''}
                        </div>
                        <div class="file-actions">
                            ${downloadHtml}
                            <button class="btn-single-delete" data-id="${doc.id}" title="Delete file">🗑️</button>
                        </div>
                    `;
                    container.appendChild(item);
                });

                container.querySelectorAll('.file-checkbox').forEach(chk => chk.addEventListener('change', updateDeleteSelectedButtonState));
                container.querySelectorAll('.btn-single-delete').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const fileId = e.currentTarget.getAttribute('data-id');
                        const confirmed = await openModal({
                            title: 'Delete File',
                            icon: 'fa-trash-alt',
                            iconColor: 'var(--danger)',
                            message: 'This will permanently delete the file and all its chunks. Are you sure?',
                            confirmText: 'Delete',
                            danger: true,
                            input: true,
                            inputLabel: 'Type DELETE to confirm:',
                            inputPlaceholder: 'Type DELETE…',
                            expectedValue: 'DELETE',
                            showCancel: true
                        });
                        if (confirmed) {
                            try {
                                await db.collection('files').doc(fileId).delete();
                                const chunksSnap = await db.collection('fileChunks').where('fileId', '==', fileId).get();
                                const batch = db.batch();
                                chunksSnap.forEach(d => batch.delete(d.ref));
                                await batch.commit();
                                showToast('File deleted successfully', 'success');
                            } catch (err) {
                                showToast('Delete failed: ' + err.message, 'error');
                            }
                        }
                    });
                });
            }, console.error);

            if (workUnsubscribe) workUnsubscribe();
            workUnsubscribe = db.collection('works').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
                const container = workList;
                container.innerHTML = '';
                workCount.textContent = snapshot.size;

                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-clipboard-list"></i>No work entries yet.</div>';
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const item = document.createElement('div');
                    item.classList.add('work-item');
                    const dateStr = data.date ? new Date(data.date.toMillis()).toLocaleDateString('en-GB') : '';
                    const totalAmount = data.amount || 0;
                    const earnings = data.earnings && data.earnings[currentUser.uid] ? data.earnings[currentUser.uid] : 0;
                    const earningsDisplay = earnings > 0 ? ` (Your share: $${earnings.toFixed(2)})` : '';
                    item.innerHTML = `
                        <div class="work-details">
                            <span class="date">${dateStr}</span>
                            <span class="name">${escapeHtml(data.workName)}</span>
                            <span class="amount">Amount: $${totalAmount.toFixed(2)}</span>
                            <span class="earnings">${earningsDisplay}</span>
                        </div>
                        <div class="work-actions">
                            <button class="btn-work-delete" data-id="${doc.id}" title="Delete"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    `;
                    container.appendChild(item);
                });

                container.querySelectorAll('.btn-work-delete').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const workId = e.currentTarget.getAttribute('data-id');
                        const confirmed = await openModal({
                            title: 'Delete Work Entry',
                            icon: 'fa-trash-alt',
                            iconColor: 'var(--danger)',
                            message: 'This will permanently delete this work entry and adjust all users\' balances accordingly.',
                            confirmText: 'Delete',
                            danger: true,
                            input: true,
                            inputLabel: 'Type DELETE to confirm:',
                            inputPlaceholder: 'Type DELETE…',
                            expectedValue: 'DELETE',
                            showCancel: true
                        });
                        if (confirmed) {
                            try {
                                await deleteWorkAndAdjustBalance(workId);
                                showToast('Work entry deleted and balances adjusted.', 'success');
                            } catch (err) {
                                showToast('Error: ' + err.message, 'error');
                            }
                        }
                    });
                });
            }, console.error);

            if (userUnsubscribe) userUnsubscribe();
            userUnsubscribe = db.collection('users').doc(currentUser.uid).onSnapshot(doc => {
                if (doc.exists) {
                    currentUserData = doc.data();
                    updateBalanceDisplay(currentUserData.balance || 0);
                }
            }, console.error);
        }

        function detachListeners() {
            if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }
            if (fileUnsubscribe) { fileUnsubscribe(); fileUnsubscribe = null; }
            if (workUnsubscribe) { workUnsubscribe(); workUnsubscribe = null; }
            if (userUnsubscribe) { userUnsubscribe(); userUnsubscribe = null; }
        }

        // ====================== SELECT ALL & DELETE ======================
        selectAllCheckbox.addEventListener('change', (e) => {
            document.querySelectorAll('.file-checkbox').forEach(chk => chk.checked = e.target.checked);
            updateDeleteSelectedButtonState();
        });

        function updateDeleteSelectedButtonState() {
            const checked = document.querySelectorAll('.file-checkbox:checked').length;
            if (checked > 0) {
                deleteSelectedBtn.style.display = 'inline-block';
                deleteSelectedBtn.textContent = `Delete (${checked})`;
            } else {
                deleteSelectedBtn.style.display = 'none';
            }
        }

        deleteSelectedBtn.addEventListener('click', async () => {
            const checkboxes = document.querySelectorAll('.file-checkbox:checked');
            if (checkboxes.length === 0) return;

            const confirmed = await openModal({
                title: 'Delete Selected Files',
                icon: 'fa-trash-alt',
                iconColor: 'var(--danger)',
                message: `Are you sure you want to delete ${checkboxes.length} selected file(s)? This cannot be undone.`,
                confirmText: 'Delete All',
                danger: true,
                input: true,
                inputLabel: `Type DELETE to confirm deleting ${checkboxes.length} file(s):`,
                inputPlaceholder: 'Type DELETE…',
                expectedValue: 'DELETE',
                showCancel: true
            });

            if (!confirmed) return;

            deleteSelectedBtn.disabled = true;
            deleteSelectedBtn.textContent = 'Deleting…';
            try {
                const batch = db.batch();
                const fileIds = [];
                checkboxes.forEach(chk => {
                    const id = chk.getAttribute('data-id');
                    fileIds.push(id);
                    batch.delete(db.collection('files').doc(id));
                });
                await batch.commit();
                for (const fileId of fileIds) {
                    const chunksSnap = await db.collection('fileChunks').where('fileId', '==', fileId).get();
                    const chunkBatch = db.batch();
                    chunksSnap.forEach(d => chunkBatch.delete(d.ref));
                    await chunkBatch.commit();
                }
                showToast(`${fileIds.length} file(s) deleted`, 'success');
            } catch (err) {
                showToast('Error: ' + err.message, 'error');
            } finally {
                deleteSelectedBtn.disabled = false;
                selectAllCheckbox.checked = false;
            }
        });

        // ====================== CHAT ======================
        sendChatBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || !currentUser) return;
            sendChatBtn.disabled = true;
            db.collection('messages').add({
                text, uid: currentUser.uid, email: currentUser.email,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                chatInput.value = '';
                sendChatBtn.disabled = false;
            }).catch(() => {
                sendChatBtn.disabled = false;
                showToast('Failed to send message', 'error');
            });
        }

        // ====================== IMAGE UPLOAD ======================
        async function uploadImageToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || 'Cloudinary upload failed');
            }
            const data = await response.json();
            if (!data.secure_url) throw new Error('Cloudinary did not return a secure URL');
            return data.secure_url;
        }

        imageInput.addEventListener('change', () => {
            imageFileName.textContent = imageInput.files[0] ? imageInput.files[0].name : '';
        });

        uploadImageBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            if (!file) { showToast('Please select an image.', 'warning'); return; }
            if (!currentUser) return;
            uploadImageBtn.disabled = true;
            uploadImageBtn.textContent = 'Uploading…';
            try {
                const imageUrl = await uploadImageToCloudinary(file);
                await db.collection('files').add({
                    name: file.name, size: file.size, url: imageUrl, type: 'image',
                    uid: currentUser.uid, email: currentUser.email,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                imageInput.value = '';
                imageFileName.textContent = '';
                showToast('Image uploaded successfully!', 'success');
                updateFileList();   // NEW: refresh glass design
            } catch (err) {
                showToast('Upload failed: ' + err.message, 'error');
            } finally {
                uploadImageBtn.disabled = false;
                uploadImageBtn.textContent = 'Upload';
            }
        });

        // ====================== DOCUMENT UPLOAD ======================
        const CHUNK_SIZE = 600 * 1024;

        function generateFileId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
        }

        function updateProgress(percent) {
            docProgressBar.value = percent;
            docProgressText.textContent = percent + '%';
            if (percent >= 100) {
                setTimeout(() => { docProgressWrap.classList.remove('show'); docProgressBar.value = 0; docProgressText.textContent = '0%'; }, 1500);
            } else {
                docProgressWrap.classList.add('show');
            }
        }

        documentInput.addEventListener('change', () => {
            docFileName.textContent = documentInput.files[0] ? documentInput.files[0].name : '';
        });

        uploadDocumentBtn.addEventListener('click', async () => {
            const file = documentInput.files[0];
            if (!file) { showToast('Please select a document.', 'warning'); return; }
            if (!currentUser) return;

            uploadDocumentBtn.disabled = true;
            uploadDocumentBtn.textContent = 'Uploading…';

            if (file.size <= CHUNK_SIZE) {
                try {
                    const base64Data = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });
                    await db.collection('files').add({
                        name: file.name, size: file.size, url: base64Data, type: 'document',
                        uid: currentUser.uid, email: currentUser.email,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(), totalChunks: 1
                    });
                    documentInput.value = '';
                    docFileName.textContent = '';
                    showToast('Document uploaded successfully!', 'success');
                    updateFileList();
                    uploadDocumentBtn.disabled = false;
                    uploadDocumentBtn.textContent = 'Upload Doc';
                    return;
                } catch (err) {
                    showToast('Upload failed: ' + err.message, 'error');
                    uploadDocumentBtn.disabled = false;
                    uploadDocumentBtn.textContent = 'Upload Doc';
                    return;
                }
            }

            try {
                const fileId = generateFileId();
                const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
                const fileBuffer = await file.arrayBuffer();

                await db.collection('files').doc(fileId).set({
                    id: fileId, name: file.name, size: file.size, type: 'document',
                    totalChunks: totalChunks, status: 'uploading',
                    uid: currentUser.uid, email: currentUser.email,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                for (let i = 0; i < totalChunks; i++) {
                    const start = i * CHUNK_SIZE;
                    const end = Math.min(start + CHUNK_SIZE, file.size);
                    const chunkData = new Uint8Array(fileBuffer.slice(start, end));
                    const firestoreBlob = firebase.firestore.Blob.fromUint8Array(chunkData);

                    await db.collection('fileChunks').add({
                        fileId: fileId, chunkIndex: i, totalChunks: totalChunks,
                        data: firestoreBlob, timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    const percent = Math.round(((i + 1) / totalChunks) * 100);
                    updateProgress(percent);
                }

                await db.collection('files').doc(fileId).update({
                    status: 'completed', completedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                documentInput.value = '';
                docFileName.textContent = '';
                showToast(`Large file uploaded! (${totalChunks} chunks)`, 'success');
                updateProgress(100);
                updateFileList();
            } catch (err) {
                console.error('Chunk upload error:', err);
                showToast('Upload failed: ' + err.message, 'error');
            } finally {
                uploadDocumentBtn.disabled = false;
                uploadDocumentBtn.textContent = 'Upload Doc';
            }
        });

        // ====================== DOWNLOAD ======================
        window.downloadChunkedFile = async function(fileId) {
            try {
                const docRef = db.collection('files').doc(fileId);
                const metaSnap = await docRef.get();
                if (!metaSnap || !metaSnap.exists()) { showToast('File metadata not found.', 'error'); return; }

                const meta = metaSnap.data();
                const totalChunks = meta.totalChunks || 0;
                if (totalChunks === 0) { showToast('Invalid file: no chunks found.', 'error'); return; }

                showToast('Downloading file… please wait.', 'info');

                const chunksSnap = await db.collection('fileChunks').where('fileId', '==', fileId).orderBy('chunkIndex', 'asc').get();

                if (chunksSnap.empty) { showToast('No chunks found for this file.', 'error'); return; }

                const chunks = [];
                let totalSize = 0;
                chunksSnap.forEach(doc => {
                    const data = doc.data();
                    const chunkBlob = data.data;
                    if (chunkBlob) {
                        const chunkArray = chunkBlob.toUint8Array ? chunkBlob.toUint8Array() : new Uint8Array(chunkBlob);
                        chunks.push(chunkArray);
                        totalSize += chunkArray.length;
                    }
                });

                const fullArray = new Uint8Array(totalSize);
                let offset = 0;
                for (const chunk of chunks) {
                    fullArray.set(chunk, offset);
                    offset += chunk.length;
                }

                const blob = new Blob([fullArray], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = meta.name || 'downloaded_file';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
                showToast('File downloaded successfully!', 'success');
            } catch (err) {
                console.error('Download error:', err);
                showToast('Download failed: ' + err.message, 'error');
            }
        };

        // ====================== WORK ======================
        (function setDefaultDate() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            workDate.value = `${yyyy}-${mm}-${dd}`;
        })();

        addWorkBtn.addEventListener('click', addWork);
        workName.addEventListener('keydown', e => { if (e.key === 'Enter') addWork(); });
        workAmount.addEventListener('keydown', e => { if (e.key === 'Enter') addWork(); });

        async function addWork() {
            if (!currentUser) return;
            const dateVal = workDate.value;
            const name = workName.value.trim();
            const amount = parseFloat(workAmount.value);
            if (!dateVal || !name || isNaN(amount) || amount <= 0) {
                showToast('Please fill all fields with valid values.', 'warning');
                return;
            }

            addWorkBtn.disabled = true;
            addWorkBtn.textContent = 'Adding…';

            try {
                const usersSnapshot = await db.collection('users').get();
                if (usersSnapshot.empty) throw new Error('No users found.');

                const earningsMap = {};
                const batch = db.batch();
                let totalEarnings = 0;
                usersSnapshot.forEach(doc => {
                    const data = doc.data();
                    const percent = data.percentage || 100;
                    const earning = amount * (percent / 100);
                    earningsMap[doc.id] = earning;
                    totalEarnings += earning;
                    const currentBalance = data.balance || 0;
                    batch.update(doc.ref, { balance: currentBalance + earning });
                });

                const workRef = db.collection('works').doc();
                batch.set(workRef, {
                    amount: amount,
                    workName: name,
                    date: new Date(dateVal),
                    earnings: earningsMap,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    createdBy: currentUser.uid,
                    createdByEmail: currentUser.email
                });

                await batch.commit();

                workName.value = '';
                workAmount.value = '';
                showToast(`Work added! Distributed $${totalEarnings.toFixed(2)} to all users.`, 'success');
            } catch (err) {
                console.error(err);
                showToast('Failed to add work: ' + err.message, 'error');
            } finally {
                addWorkBtn.disabled = false;
                addWorkBtn.textContent = 'Add Work';
            }
        }

        async function deleteWorkAndAdjustBalance(workId) {
            const workRef = db.collection('works').doc(workId);
            const workSnap = await workRef.get();
            if (!workSnap.exists) throw new Error('Work entry not found.');
            const workData = workSnap.data();
            const earningsMap = workData.earnings || {};

            const batch = db.batch();
            for (const [userId, earning] of Object.entries(earningsMap)) {
                if (earning === 0) continue;
                const userRef = db.collection('users').doc(userId);
                const userSnap = await userRef.get();
                if (!userSnap.exists) continue;
                const currentBalance = userSnap.data().balance || 0;
                batch.update(userRef, { balance: Math.max(0, currentBalance - earning) });
            }
            batch.delete(workRef);
            await batch.commit();
        }

        // ====================== AUTO REFRESH AFTER FILE UPLOAD ======================
        function updateFileList() {
            if (!currentUser) return;

            const unsubscribe = db.collection('files').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
                const container = fileList;
                container.innerHTML = '';

                fileCount.textContent = snapshot.size;

                if (snapshot.empty) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-folder-open"></i>No files shared yet.</div>';
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const item = document.createElement('div');
                    item.classList.add('file-item');
                    const sizeStr = data.size ? (data.size / 1024).toFixed(1) + ' KB' : '';
                    const icon = data.type === 'image' ? '🖼️' : '📄';
                    const isChunked = data.totalChunks && data.totalChunks > 0;

                    let downloadHtml = '';
                    if (isChunked) {
                        downloadHtml = `<button class="download-btn" onclick="downloadChunkedFile('${doc.id}')">Download</button>`;
                    } else {
                        const url = data.url || '#';
                        downloadHtml = `<a href="${escapeHtml(url)}" download="${escapeHtml(data.name)}" target="_blank">Download</a>`;
                    }

                    item.innerHTML = `
                        <div class="file-info">
                            <input type="checkbox" class="file-checkbox" data-id="${doc.id}">
                            <span class="file-icon">${icon}</span>
                            <span class="file-name" title="${escapeHtml(data.name)}">${escapeHtml(data.name)}</span>
                            <span class="file-size">${sizeStr}</span>
                            ${isChunked ? `<span class="file-size parts">(${data.totalChunks} parts)</span>` : ''}
                        </div>
                        <div class="file-actions">
                            ${downloadHtml}
                            <button class="btn-single-delete" data-id="${doc.id}" title="Delete file">🗑️</button>
                        </div>
                    `;
                    container.appendChild(item);
                });

                container.querySelectorAll('.file-checkbox').forEach(chk => chk.addEventListener('change', updateDeleteSelectedButtonState));
                container.querySelectorAll('.btn-single-delete').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const fileId = e.currentTarget.getAttribute('data-id');
                        const confirmed = await openModal({
                            title: 'Delete File',
                            icon: 'fa-trash-alt',
                            iconColor: 'var(--danger)',
                            message: 'This will permanently delete the file and all its chunks. Are you sure?',
                            confirmText: 'Delete',
                            danger: true,
                            input: true,
                            inputLabel: 'Type DELETE to confirm:',
                            inputPlaceholder: 'Type DELETE…',
                            expectedValue: 'DELETE',
                            showCancel: true
                        });
                        if (confirmed) {
                            try {
                                await db.collection('files').doc(fileId).delete();
                                const chunksSnap = await db.collection('fileChunks').where('fileId', '==', fileId).get();
                                const batch = db.batch();
                                chunksSnap.forEach(d => batch.delete(d.ref));
                                await batch.commit();
                                showToast('File deleted successfully', 'success');
                            } catch (err) {
                                showToast('Delete failed: ' + err.message, 'error');
                            }
                        }
                    });
                });
            }, console.error);
        }

        // ====================== UTILITY ======================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ====================== KEYBOARD ======================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (modal.classList.contains('open')) {
                    if (modalResolve) modalResolve(false);
                    closeModal();
                }
            }
        });

        console.log('🚀 Rokon Workspace v9 — macOS Tahoe Liquid Glass + auto file refresh');
    </script>
