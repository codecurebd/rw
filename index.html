<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Rokon Workspace</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1788927926/ybnqakprht9dilzx8ox1.png" />

    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* ============================================================
           🎨 ROOT VARIABLES & RESET
           ============================================================ */
        :root {
            --bg-primary: #f0f4f9;
            --bg-surface: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.72);
            --bg-glass-hover: rgba(255, 255, 255, 0.88);
            --text-primary: #0a1a2e;
            --text-secondary: #4a5a72;
            --text-muted: #8a9eb5;
            --border-light: rgba(0, 0, 0, 0.05);
            --border-glass: rgba(255, 255, 255, 0.6);
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.08);
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --transition: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --accent: #1a5cdb;
            --accent-hover: #0f4ab8;
            --accent-gradient: linear-gradient(135deg, #1a5cdb, #5856d6);
            --danger: #dc3545;
            --success: #28a745;
            --warning: #ffc107;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* ============================================================
           🏗️ APP CONTAINER — scrolls naturally
           ============================================================ */
        .app-container {
            width: 100%;
            max-width: 1280px;
            background: var(--bg-surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            contain: layout style paint;
            min-height: 90vh;
        }

        /* ============================================================
           ⏳ LOADING OVERLAY
           ============================================================ */
        .loading-overlay {
            position: absolute;
            inset: 0;
            z-index: 9999;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 18px;
            border-radius: var(--radius-xl);
        }
        .loading-overlay.active {
            display: flex;
        }
        .loading-overlay .spinner {
            width: 44px;
            height: 44px;
            border: 3.5px solid rgba(26, 92, 219, 0.08);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-overlay p {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }

        /* ============================================================
           🔐 LOGIN SCREEN
           ============================================================ */
        #loginScreen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 32px 24px;
            background: linear-gradient(145deg, #ffffff, #f4f8fc);
        }
        #loginScreen.active {
            display: flex;
        }
        #loginScreen .login-logo {
            width: 96px;
            height: auto;
            margin-bottom: 28px;
            filter: drop-shadow(0 4px 16px rgba(26, 92, 219, 0.10));
        }
        .login-box {
            width: 100%;
            max-width: 380px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 32px 28px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-md);
        }
        .login-box input {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 14px;
            border: 1.5px solid rgba(0, 0, 0, 0.06);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            outline: none;
            color: var(--text-primary);
        }
        .login-box input:focus {
            border-color: var(--accent);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(26, 92, 219, 0.06);
        }
        .login-box input::placeholder {
            color: var(--text-muted);
        }
        .login-box .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }
        .login-box button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-primary {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 4px 16px rgba(26, 92, 219, 0.20);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(26, 92, 219, 0.30);
        }
        .btn-primary:active {
            transform: translateY(0) scale(0.98);
        }
        .btn-secondary {
            background: rgba(0, 0, 0, 0.04);
            color: var(--text-primary);
        }
        .btn-secondary:hover {
            background: rgba(0, 0, 0, 0.08);
        }
        .login-error {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 14px;
            text-align: center;
            min-height: 1.4em;
        }

        /* ============================================================
           📊 DASHBOARD
           ============================================================ */
        #dashboard {
            display: none;
            flex-direction: column;
            height: 100%;
            contain: layout style;
        }
        #dashboard.active {
            display: flex;
        }

        /* ---- HEADER (sticky) ---- */
        .dashboard-header {
            padding: 14px 24px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            flex-shrink: 0;
            min-height: 64px;
            contain: layout style;
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255, 255, 255, 0.92);
        }
        .dashboard-header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dashboard-header .brand img {
            height: 34px;
            width: auto;
            display: block;
        }
        .dashboard-header .brand h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }
        .dashboard-header .brand .live-badge {
            background: rgba(26, 92, 219, 0.08);
            padding: 3px 12px;
            border-radius: 40px;
            font-size: 0.6rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-left: 4px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-info .email-badge {
            background: rgba(0, 0, 0, 0.04);
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-info .balance-badge {
            background: rgba(26, 92, 219, 0.08);
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 600;
            white-space: nowrap;
        }
        .btn-logout {
            background: none;
            border: 1.5px solid rgba(0, 0, 0, 0.06);
            padding: 7px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-logout:hover {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.12);
        }
        .btn-settings {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 40px;
            transition: var(--transition);
        }
        .btn-settings:hover {
            background: rgba(0, 0, 0, 0.04);
            color: var(--text-primary);
        }

        /* ---- BODY ---- */
        .dashboard-body {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 16px;
            gap: 16px;
            background: var(--bg-primary);
            contain: layout style;
        }

        /* --- Main row: Chat + Files (takes most height) --- */
        .dashboard-body .main-row {
            display: flex;
            gap: 16px;
            flex: 1 1 auto;
            min-height: 55vh;
            max-height: 72vh;
        }
        .dashboard-body .main-row .col {
            flex: 1;
            background: var(--bg-surface);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
            border: 1px solid var(--border-light);
            contain: layout style;
        }

        .col-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-light);
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            background: rgba(248, 250, 252, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .col-header .badge {
            background: rgba(0, 0, 0, 0.04);
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.6rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        /* ============================================================
           💬 CHAT
           ============================================================ */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(248, 250, 252, 0.3);
            min-height: 120px;
            contain: layout style;
            will-change: scroll-position;
        }
        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.10);
            border-radius: 10px;
        }

        .message {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-wrap: break-word;
            animation: msgIn 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            contain: layout style;
        }
        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(6px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .message.self {
            align-self: flex-end;
            background: var(--accent-gradient);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.other {
            align-self: flex-start;
            background: #eef3f9;
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }
        .message .meta {
            font-size: 0.55rem;
            opacity: 0.55;
            margin-top: 4px;
            display: flex;
            gap: 8px;
        }
        .message.self .meta {
            color: rgba(255, 255, 255, 0.6);
        }

        .chat-input-area {
            padding: 10px 14px;
            border-top: 1px solid var(--border-light);
            display: flex;
            gap: 8px;
            background: var(--bg-surface);
            flex-shrink: 0;
            align-items: center;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 16px;
            border: 1.5px solid rgba(0, 0, 0, 0.06);
            border-radius: 40px;
            font-size: 0.9rem;
            transition: var(--transition);
            background: rgba(248, 250, 252, 0.6);
            outline: none;
            color: var(--text-primary);
            min-height: 42px;
        }
        .chat-input-area input:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(26, 92, 219, 0.06);
        }
        .chat-input-area input::placeholder {
            color: var(--text-muted);
        }
        .chat-input-area button {
            padding: 10px 22px;
            border: none;
            background: var(--accent-gradient);
            color: #fff;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            box-shadow: 0 4px 16px rgba(26, 92, 219, 0.15);
            flex-shrink: 0;
        }
        .chat-input-area button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 92, 219, 0.25);
        }
        .chat-input-area button:active {
            transform: scale(0.97);
        }

        /* ============================================================
           📎 FILES
           ============================================================ */
        .file-toolbar {
            padding: 8px 16px;
            background: rgba(248, 250, 252, 0.4);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .file-toolbar label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.8rem;
            user-select: none;
        }
        .file-toolbar label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .btn-delete-selected {
            background: rgba(220, 53, 69, 0.08);
            color: var(--danger);
            border: 1px solid rgba(220, 53, 69, 0.15);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: none;
        }
        .btn-delete-selected:hover {
            background: var(--danger);
            color: #fff;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(248, 250, 252, 0.3);
            min-height: 100px;
            contain: layout style;
        }
        .file-list::-webkit-scrollbar {
            width: 4px;
        }
        .file-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .file-list::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.08);
            border-radius: 10px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 14px;
            background: var(--bg-surface);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            transition: var(--transition);
            animation: fadeIn 0.2s ease;
            contain: layout style;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .file-item:hover {
            background: rgba(248, 250, 252, 0.6);
            border-color: rgba(0, 0, 0, 0.08);
        }
        .file-item .file-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            flex: 1;
            min-width: 0;
        }
        .file-item .file-checkbox {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
            flex-shrink: 0;
        }
        .file-item .file-icon {
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .file-item .file-name {
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }
        .file-item .file-size {
            font-size: 0.65rem;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-left: 4px;
        }
        .file-item .file-size.parts {
            color: var(--accent);
            font-weight: 500;
        }
        .file-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .file-actions a,
        .file-actions .download-btn {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.72rem;
            background: rgba(26, 92, 219, 0.06);
            padding: 4px 12px;
            border-radius: 40px;
            border: 1px solid rgba(26, 92, 219, 0.08);
            transition: var(--transition);
            cursor: pointer;
            display: inline-block;
        }
        .file-actions a:hover,
        .file-actions .download-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-single-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px 6px;
            border-radius: 6px;
            transition: var(--transition);
        }
        .btn-single-delete:hover {
            color: var(--danger);
            background: rgba(220, 53, 69, 0.06);
        }

        /* ---- UPLOAD AREA ---- */
        .file-upload-container {
            padding: 10px 14px;
            border-top: 1px solid var(--border-light);
            background: var(--bg-surface);
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }
        .upload-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .upload-row .file-label {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(248, 250, 252, 0.5);
            padding: 5px 12px 5px 10px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: var(--transition);
            border: 1px solid var(--border-light);
            flex: 1;
            min-width: 0;
        }
        .upload-row .file-label:hover {
            background: rgba(248, 250, 252, 0.8);
            border-color: rgba(0, 0, 0, 0.08);
        }
        .upload-row .file-label i {
            font-size: 1rem;
            color: var(--accent);
            flex-shrink: 0;
        }
        .upload-row .file-label input[type="file"] {
            display: none;
        }
        .upload-row .file-label .file-name {
            color: var(--text-muted);
            font-weight: 400;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 120px;
        }
        .upload-row button {
            padding: 6px 16px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.78rem;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-img-upload {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 2px 12px rgba(26, 92, 219, 0.15);
        }
        .btn-img-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26, 92, 219, 0.25);
        }
        .btn-doc-upload {
            background: var(--text-primary);
            color: #fff;
            box-shadow: 0 2px 12px rgba(10, 26, 46, 0.15);
        }
        .btn-doc-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(10, 26, 46, 0.25);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ---- PROGRESS BAR ---- */
        .upload-progress-wrap {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 2px 0;
        }
        .upload-progress-wrap.show {
            display: flex;
        }
        .upload-progress-wrap progress {
            flex: 1;
            height: 6px;
            border-radius: 10px;
            overflow: hidden;
            border: none;
            background: rgba(0, 0, 0, 0.04);
        }
        .upload-progress-wrap progress::-webkit-progress-bar {
            background: rgba(0, 0, 0, 0.04);
            border-radius: 10px;
        }
        .upload-progress-wrap progress::-webkit-progress-value {
            background: var(--accent-gradient);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .upload-progress-wrap .progress-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
            min-width: 36px;
            text-align: right;
        }

        .empty-state {
            color: var(--text-muted);
            text-align: center;
            padding: 32px 16px;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

    <!-- ============================================================

    <!-- ============================================================

    <!-- ============================================================
    📦 JAVASCRIPT
    ============================================================ -->
    <script>
        // ============================================================
        // 1. FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD-RHTu4TNjlEdH3M7O6-1HVaniVCPMEyI",
            authDomain: "rokon-workspace.firebaseapp.com",
            projectId: "rokon-workspace",
            storageBucket: "rokon-workspace.firebasestorage.app",
            messagingSenderId: "118826238702",
            appId: "1:118826238702:web:1917db220805b2012a69ff"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // 2. CLOUDINARY
        // ============================================================
        const CLOUDINARY_CLOUD_NAME = "zmoyykj7";
        const CLOUDINARY_UPLOAD_PRESET = "codecurebd";

        // ============================================================
        // 3. DOM REFS
        // ============================================================
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loginScreen = document.getElementById('loginScreen');
        const dashboard = document.getElementById('dashboard');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const userEmailDisplay = document.getElementById('userEmailDisplay');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const settingsBtn = document.getElementById('settingsBtn');

        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendChatBtn = document.getElementById('sendChatBtn');

        const fileList = document.getElementById('fileList');
        const fileCount = document.getElementById('fileCount');
        const selectAllCheckbox = document.getElementById('selectAllCheckbox');
        const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');

        const imageInput = document.getElementById('imageInput');
        const uploadImageBtn = document.getElementById('uploadImageBtn');
        const imageFileName = document.getElementById('imageFileName');
        const documentInput = document.getElementById('documentInput');
        const uploadDocumentBtn = document.getElementById('uploadDocumentBtn');
        const docFileName = document.getElementById('docFileName');

        const docProgressWrap = document.getElementById('docProgressWrap');
        const docProgressBar = document.getElementById('docProgressBar');
        const docProgressText = document.getElementById('docProgressText');

        const workDate = document.getElementById('workDate');
        const workName = document.getElementById('workName');
        const workAmount = document.getElementById('workAmount');
        const addWorkBtn = document.getElementById('addWorkBtn');
        const workList = document.getElementById('workList');
        const workCount = document.getElementById('workCount');

        // ============================================================
        // 4. MODAL SYSTEM
        // ============================================================
        const modal = document.getElementById('customModal');
        const modalBox = document.getElementById('modalBox');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalInputGroup = document.getElementById('modalInputGroup');
        const modalInput = document.getElementById('modalInput');
        const modalInputLabel = document.getElementById('modalInputLabel');
        const modalInputError = document.getElementById('modalInputError');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');

        let modalResolve = null;
        let modalReject = null;
        let modalExpectedValue = '';
        let modalCustomConfirm = null;

        function openModal(options) {
            return new Promise((resolve, reject) => {
                const {
                    title = 'Notice',
                    icon = 'fa-info-circle',
                    iconColor = 'var(--accent)',
                    message = '',
                    confirmText = 'Confirm',
                    cancelText = 'Cancel',
                    showCancel = true,
                    input = false,
                    inputLabel = 'Type to confirm:',
                    inputPlaceholder = 'Type here…',
                    expectedValue = '',
                    danger = false,
                    success = false,
                    warning = false,
                    customConfirm = null,
                } = options;

                modalResolve = resolve;
                modalReject = reject;
                modalCustomConfirm = customConfirm;

                let iconHtml = '';
                if (icon) {
                    let colorClass = '';
                    if (danger) colorClass = 'danger';
                    else if (success) colorClass = 'success';
                    else if (warning) colorClass = 'warning';
                    iconHtml = `<div class="modal-icon ${colorClass}"><i class="fas ${icon}"></i></div>`;
                }

                modalTitle.innerHTML = `<i class="fas ${icon}" style="color:${iconColor};"></i> ${title}`;
                modalBody.innerHTML = iconHtml + (message || '');

                if (input) {
                    modalInputGroup.classList.remove('hidden');
                    modalInputLabel.textContent = inputLabel;
                    modalInput.placeholder = inputPlaceholder;
                    modalInput.value = '';
                    modalInput.classList.remove('error');
                    modalInputError.classList.remove('show');
                    modalExpectedValue = expectedValue || '';
                    modalConfirmBtn.disabled = true;
                    modalInput.focus();
                    modalInput.addEventListener('input', onModalInput);
                } else {
                    modalInputGroup.classList.add('hidden');
                    modalExpectedValue = '';
                    modalConfirmBtn.disabled = false;
                }

                modalConfirmBtn.textContent = confirmText;
                modalCancelBtn.textContent = cancelText;
                modalCancelBtn.style.display = showCancel ? '' : 'none';

                if (danger) {
                    modalConfirmBtn.className = 'btn-modal-danger';
                } else {
                    modalConfirmBtn.className = 'btn-modal-primary';
                }

                const handleConfirm = () => {
                    if (modalCustomConfirm) {
                        const result = modalCustomConfirm();
                        if (result !== false) {
                            resolve(result);
                            closeModal();
                        }
                        return;
                    }
                    if (input) {
                        const val = modalInput.value.trim();
                        if (expectedValue && val.toLowerCase() !== expectedValue.toLowerCase()) {
                            modalInput.classList.add('error');
                            modalInputError.classList.add('show');
                            return;
                        }
                        modalInput.classList.remove('error');
                        modalInputError.classList.remove('show');
                        resolve(val);
                    } else {
                        resolve(true);
                    }
                    closeModal();
                };

                const handleCancel = () => {
                    resolve(false);
                    closeModal();
                };

                modal._onConfirm = handleConfirm;
                modal._onCancel = handleCancel;
                modal._onClose = handleCancel;

                modalConfirmBtn.onclick = modal._onConfirm;
                modalCancelBtn.onclick = modal._onCancel;
                modalCloseBtn.onclick = modal._onClose;
                modal.onclick = (e) => { if (e.target === modal) modal._onClose(); };
                modalInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') modal._onConfirm();
                    if (e.key === 'Escape') modal._onCancel();
                });

                modal.classList.add('open');
                document.body.style.overflow = 'hidden';
            });
        }

        function onModalInput() {
            const val = modalInput.value.trim();
            if (modalExpectedValue) {
                const match = val.toLowerCase() === modalExpectedValue.toLowerCase();
                modalConfirmBtn.disabled = !match;
                if (val.length > 0 && !match) {
                    modalInput.classList.add('error');
                    modalInputError.classList.add('show');
                } else {
                    modalInput.classList.remove('error');
                    modalInputError.classList.remove('show');
                }
            } else {
                modalConfirmBtn.disabled = val.length === 0;
            }
        }

        function closeModal() {
            modal.classList.remove('open');
            document.body.style.overflow = '';
            modalInput.value = '';
            modalInput.classList.remove('error');
            modalInputError.classList.remove('show');
            modalConfirmBtn.disabled = false;
            modalInput.removeEventListener('input', onModalInput);
            modalResolve = null;
            modalReject = null;
            modalCustomConfirm = null;
        }

        // ============================================================
        // 5. TOAST SYSTEM
        // ============================================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.info}"></i>
                <span>${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 400);
            }, 4500);
        }
        window.showToast = showToast;

        // ============================================================
        // 6. LOADING
        // ============================================================
        function showLoading() { loadingOverlay.classList.add('active'); }

        function hideLoading() { loadingOverlay.classList.remove('active'); }

        // ============================================================
        // 7. AUTH & USER SETUP
        // ============================================================
        let currentUser = null;
        let currentUserData = null;

        auth.onAuthStateChanged(async user => {
            if (user) {
                currentUser = user;
                userEmailDisplay.textContent = user.email;
                await ensureUserDocument(user.uid, user.email);
                await loadUserData(user.uid);
                showDashboard();
                startRealtimeListeners();
                hideLoading();
            } else {
                currentUser = null;
                currentUserData = null;
                showLogin();
                detachListeners();
                hideLoading();
            }
        });

        async function ensureUserDocument(uid, email) {
            const docRef = db.collection('users').doc(uid);
            const snap = await docRef.get();
            if (!snap.exists) {
                await docRef.set({
                    balance: 0,
                    percentage: 100,
                    email: email || '',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } else {
                const data = snap.data();
                if (!data.email || data.email !== email) {
                    await docRef.update({ email: email || '' });
                }
            }
        }

        async function loadUserData(uid) {
            const docRef = db.collection('users').doc(uid);
            const snap = await docRef.get();
            if (snap.exists) {
                currentUserData = snap.data();
                updateBalanceDisplay(currentUserData.balance || 0);
            } else {
                currentUserData = { balance: 0, percentage: 100 };
                updateBalanceDisplay(0);
            }
        }

        function updateBalanceDisplay(balance) {
            balanceDisplay.textContent = `Balance: $${balance.toFixed(2)}`;
        }

        // ============================================================
        // 8. SETTINGS — Show all users with email & percentage
        // ============================================================
        settingsBtn.addEventListener('click', async () => {
            if (!currentUser) return;

            try {
                const usersSnapshot = await db.collection('users').get();
                if (usersSnapshot.empty) {
                    showToast('No users found.', 'warning');
                    return;
                }

                const users = [];
                usersSnapshot.forEach(doc => {
                    const data = doc.data();
                    users.push({
                        id: doc.id,
                        email: data.email || doc.id,
                        percentage: data.percentage || 100
                    });
                });

                let userListHtml = `
                    <div class="user-list-container">
                `;
                users.forEach(user => {
                    userListHtml += `
                        <div class="user-row">
                            <span class="user-email" title="${escapeHtml(user.email)}">${escapeHtml(user.email)}</span>
                            <input type="number" class="user-percent-input" data-id="${user.id}" value="${user.percentage}" min="0" max="100" step="1" />
                            <span class="user-percent-label">%</span>
                            <span class="user-current">${user.percentage}%</span>
                        </div>
                    `;
                });
                userListHtml += `
                    </div>
                    <div class="info-note">
                        <i class="fas fa-info-circle"></i> 
                        Each user's percentage determines their share of every new work entry. 
                        Changes take effect for future work entries only.
                    </div>
                `;

                const result = await openModal({
                    title: 'User Earning Percentages',
                    icon: 'fa-users-cog',
                    iconColor: 'var(--accent)',
                    message: userListHtml,
                    confirmText: 'Save All',
                    danger: false,
                    showCancel: true,
                    customConfirm: () => {
                        const inputs = document.querySelectorAll('.user-percent-input');
                        const updates = {};
                        let hasError = false;
                        inputs.forEach(input => {
                            const val = parseFloat(input.value);
                            if (isNaN(val) || val < 0 || val > 100) {
                                showToast(`Invalid percentage (must be 0-100)`, 'error');
                                hasError = true;
                                return;
                            }
                            updates[input.dataset.id] = val;
                        });
                        if (hasError) return false;
                        return updates;
                    }
                });

                if (result !== false && typeof result === 'object') {
                    try {
                        const batch = db.batch();
                        for (const [userId, percent] of Object.entries(result)) {
                            const userRef = db.collection('users').doc(userId);
                            batch.update(userRef, { percentage: percent });
                        }
                        await batch.commit();
                        showToast('All user percentages updated successfully!', 'success');
                        await loadUserData(currentUser.uid);
                    } catch (err) {
                        showToast('Failed to update percentages: ' + err.message, 'error');
                    }
                }
            } catch (err) {
                showToast('Error loading users: ' + err.message, 'error');
            }
        });

        // ============================================================
        // 9. LOGIN / LOGOUT
        // ============================================================
        function showLogin() {
            loginScreen.classList.add('active');
            dashboard.classList.remove('active');
            loginError.textContent = '';
        }

        function showDashboard() {
            loginScreen.classList.remove('active');
            dashboard.classList.add('active');
        }

        loginBtn.addEventListener('click', () => {
            const email = loginEmail.value.trim();
            const pass = loginPassword.value.trim();
            if (!email || !pass) {
                loginError.textContent = 'Please enter email and password.';
                return;
            }
            showLoading();
            auth.signInWithEmailAndPassword(email, pass)
                .catch(err => { loginError.textContent = err.message;
                    hideLoading(); });
        });

        registerBtn.addEventListener('click', () => {
            const email = loginEmail.value.trim();
            const pass = loginPassword.value.trim();
            if (!email || !pass) {
                loginError.textContent = 'Please enter email and password.';
                return;
            }
            showLoading();
            auth.createUserWithEmailAndPassword(email, pass)
                .catch(err => { loginError.textContent = err.message;
                    hideLoading(); });
        });

        logoutBtn.addEventListener('click', () => {
            auth.signOut();
            showToast('Logged out', 'info');
        });

        loginEmail.addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); });
        loginPassword.addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); });

        // ============================================================
        // 10. CHAT
        // ============================================================
        let chatUnsubscribe = null;
        let fileUnsubscribe = null;
        let workUnsubscribe = null;
        let userUnsubscribe = null;

        function startRealtimeListeners() {
            if (chatUnsubscribe) chatUnsubscribe();
            chatUnsubscribe = db.collection('messages')
                .orderBy('timestamp', 'asc')
                .onSnapshot(snapshot => {
                    const container = chatMessages;
                    container.innerHTML = '';
                    if (snapshot.empty) {
                        container.innerHTML =
                            '<div class="empty-state"><i class="fas fa-comment-dots"></i>No messages yet.</div>';
                        return;
                    }
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const msgDiv = document.createElement('div');
                        msgDiv.classList.add('message');
                        msgDiv.classList.add(data.uid === currentUser.uid ? 'self' : 'other');
                        msgDiv.innerHTML = `
                                <div>${escapeHtml(data.text)}</div>
                                <div class="meta">
                                    <span>${escapeHtml(data.email || 'unknown')}</span>
                                    <span>${data.timestamp ? new Date(data.timestamp.toMillis()).toLocaleTimeString() : ''}</span>
                                </div>
                            `;
                        container.appendChild(msgDiv);
                    });
                    container.scrollTop = container.scrollHeight;
                }, console.error);

            if (fileUnsubscribe) fileUnsubscribe();
            fileUnsubscribe = db.collection('files')
                .orderBy('timestamp', 'desc')
                .onSnapshot(async snapshot => {
                    const container = fileList;
                    container.innerHTML = '';
                    fileCount.textContent = snapshot.size;
                    selectAllCheckbox.checked = false;
                    updateDeleteSelectedButtonState();

                    if (snapshot.empty) {
                        container.innerHTML =
                            '<div class="empty-state"><i class="fas fa-folder-open"></i>No files shared yet.</div>';
                        return;
                    }

                    for (const doc of snapshot.docs) {
                        const data = doc.data();
                        const item = document.createElement('div');
                        item.classList.add('file-item');
                        const sizeStr = data.size ? (data.size / 1024).toFixed(1) + ' KB' : '';
                        const icon = data.type === 'image' ? '🖼️' : '📄';
                        const isChunked = data.totalChunks && data.totalChunks > 0;

                        let downloadHtml = '';
                        if (isChunked) {
                            downloadHtml =
                                `<button class="download-btn" onclick="downloadChunkedFile('${doc.id}')">Download</button>`;
                        } else {
                            const url = data.url || '#';
                            downloadHtml =
                                `<a href="${escapeHtml(url)}" download="${escapeHtml(data.name)}" target="_blank">Download</a>`;
                        }

                        item.innerHTML = `
                                <div class="file-info">
                                    <input type="checkbox" class="file-checkbox" data-id="${doc.id}">
                                    <span class="file-icon">${icon}</span>
                                    <span class="file-name" title="${escapeHtml(data.name)}">${escapeHtml(data.name)}</span>
                                    <span class="file-size">${sizeStr}</span>
                                    ${isChunked ? `<span class="file-size parts">(${data.totalChunks} parts)</span>` : ''}
                                </div>
                                <div class="file-actions">
                                    ${downloadHtml}
                                    <button class="btn-single-delete" data-id="${doc.id}" title="Delete file">🗑️</button>
                                </div>
                            `;
                        container.appendChild(item);
                    }

                    container.querySelectorAll('.file-checkbox').forEach(chk =>
                        chk.addEventListener('change', updateDeleteSelectedButtonState)
                    );

                    container.querySelectorAll('.btn-single-delete').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            const fileId = e.currentTarget.getAttribute('data-id');
                            const confirmed = await openModal({
                                title: 'Delete File',
                                icon: 'fa-trash-alt',
                                iconColor: 'var(--danger)',
                                message: 'This will permanently delete the file and all its chunks. Are you sure?',
                                confirmText: 'Delete',
                                danger: true,
                                input: true,
                                inputLabel: 'Type DELETE to confirm:',
                                inputPlaceholder: 'Type DELETE…',
                                expectedValue: 'DELETE',
                                showCancel: true
                            });
                            if (confirmed) {
                                try {
                                    await db.collection('files').doc(fileId).delete();
                                    const chunksSnap = await db.collection('fileChunks').where('fileId',
                                        '==', fileId).get();
                                    const batch = db.batch();
                                    chunksSnap.forEach(d => batch.delete(d.ref));
                                    await batch.commit();
                                    showToast('File deleted successfully', 'success');
                                } catch (err) {
                                    showToast('Delete failed: ' + err.message, 'error');
                                }
                            }
                        });
                    });
                }, console.error);

            if (workUnsubscribe) workUnsubscribe();
            workUnsubscribe = db.collection('works')
                .orderBy('timestamp', 'desc')
                .onSnapshot(snapshot => {
                    const container = workList;
                    container.innerHTML = '';
                    workCount.textContent = snapshot.size;

                    if (snapshot.empty) {
                        container.innerHTML =
                            '<div class="empty-state"><i class="fas fa-clipboard-list"></i>No work entries yet.</div>';
                        return;
                    }

                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const item = document.createElement('div');
                        item.classList.add('work-item');
                        const dateStr = data.date ? new Date(data.date.toMillis()).toLocaleDateString(
                            'en-GB') : '';
                        const totalAmount = data.amount || 0;
                        const earnings = data.earnings && data.earnings[currentUser.uid] ? data
                            .earnings[currentUser.uid] : 0;
                        const earningsDisplay = earnings > 0 ? ` (Your share: $${earnings.toFixed(2)})` : '';
                        item.innerHTML = `
                                <div class="work-details">
                                    <span class="date">${dateStr}</span>
                                    <span class="name">${escapeHtml(data.workName)}</span>
                                    <span class="amount">Amount: $${totalAmount.toFixed(2)}</span>
                                    <span class="earnings">${earningsDisplay}</span>
                                </div>
                                <div class="work-actions">
                                    <button class="btn-work-delete" data-id="${doc.id}" title="Delete"><i class="fas fa-trash-alt"></i></button>
                                </div>
                            `;
                        container.appendChild(item);
                    });

                    container.querySelectorAll('.btn-work-delete').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            const workId = e.currentTarget.getAttribute('data-id');
                            const confirmed = await openModal({
                                title: 'Delete Work Entry',
                                icon: 'fa-trash-alt',
                                iconColor: 'var(--danger)',
                                message: 'This will permanently delete this work entry and adjust all users\' balances accordingly.',
                                confirmText: 'Delete',
                                danger: true,
                                input: true,
                                inputLabel: 'Type DELETE to confirm:',
                                inputPlaceholder: 'Type DELETE…',
                                expectedValue: 'DELETE',
                                showCancel: true
                            });
                            if (confirmed) {
                                try {
                                    await deleteWorkAndAdjustBalance(workId);
                                    showToast('Work entry deleted and balances adjusted.', 'success');
                                } catch (err) {
                                    showToast('Error: ' + err.message, 'error');
                                }
                            }
                        });
                    });
                }, console.error);

            if (userUnsubscribe) userUnsubscribe();
            userUnsubscribe = db.collection('users').doc(currentUser.uid)
                .onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        currentUserData = data;
                        updateBalanceDisplay(data.balance || 0);
                    }
                }, console.error);
        }

        function detachListeners() {
            if (chatUnsubscribe) { chatUnsubscribe();
                chatUnsubscribe = null; }
            if (fileUnsubscribe) { fileUnsubscribe();
                fileUnsubscribe = null; }
            if (workUnsubscribe) { workUnsubscribe();
                workUnsubscribe = null; }
            if (userUnsubscribe) { userUnsubscribe();
                userUnsubscribe = null; }
        }

        // ============================================================
        // 11. SELECT ALL & DELETE (Files)
        // ============================================================
        selectAllCheckbox.addEventListener('change', (e) => {
            document.querySelectorAll('.file-checkbox').forEach(chk => chk.checked = e.target.checked);
            updateDeleteSelectedButtonState();
        });

        function updateDeleteSelectedButtonState() {
            const checked = document.querySelectorAll('.file-checkbox:checked').length;
            if (checked > 0) {
                deleteSelectedBtn.style.display = 'inline-block';
                deleteSelectedBtn.textContent = `Delete (${checked})`;
            } else {
                deleteSelectedBtn.style.display = 'none';
            }
        }

        deleteSelectedBtn.addEventListener('click', async () => {
            const checkboxes = document.querySelectorAll('.file-checkbox:checked');
            if (checkboxes.length === 0) return;

            const confirmed = await openModal({
                title: 'Delete Selected Files',
                icon: 'fa-trash-alt',
                iconColor: 'var(--danger)',
                message: `Are you sure you want to delete ${checkboxes.length} selected file(s)? This cannot be undone.`,
                confirmText: 'Delete All',
                danger: true,
                input: true,
                inputLabel: `Type DELETE to confirm deleting ${checkboxes.length} file(s):`,
                inputPlaceholder: 'Type DELETE…',
                expectedValue: 'DELETE',
                showCancel: true
            });

            if (!confirmed) return;

            deleteSelectedBtn.disabled = true;
            deleteSelectedBtn.textContent = 'Deleting…';
            try {
                const batch = db.batch();
                const fileIds = [];
                checkboxes.forEach(chk => {
                    const id = chk.getAttribute('data-id');
                    fileIds.push(id);
                    batch.delete(db.collection('files').doc(id));
                });
                await batch.commit();
                for (const fileId of fileIds) {
                    const chunksSnap = await db.collection('fileChunks').where('fileId', '==', fileId).get();
                    const chunkBatch = db.batch();
                    chunksSnap.forEach(d => chunkBatch.delete(d.ref));
                    await chunkBatch.commit();
                }
                showToast(`${fileIds.length} file(s) deleted`, 'success');
            } catch (err) {
                showToast('Error: ' + err.message, 'error');
            } finally {
                deleteSelectedBtn.disabled = false;
                selectAllCheckbox.checked = false;
            }
        });

        // ============================================================
        // 12. CHAT SEND
        // ============================================================
        sendChatBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || !currentUser) return;
            sendChatBtn.disabled = true;
            db.collection('messages').add({
                text,
                uid: currentUser.uid,
                email: currentUser.email,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                chatInput.value = '';
                sendChatBtn.disabled = false;
            }).catch((err) => {
                console.error(err);
                sendChatBtn.disabled = false;
                showToast('Failed to send message', 'error');
            });
        }

        // ============================================================
        // 13. IMAGE UPLOAD (Cloudinary)
        // ============================================================
        async function uploadImageToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            const response = await fetch(
                `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                }
            );
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || 'Cloudinary upload failed');
            }
            const data = await response.json();
            if (!data.secure_url) throw new Error('Cloudinary did not return a secure URL');
            return data.secure_url;
        }

        imageInput.addEventListener('change', () => {
            imageFileName.textContent = imageInput.files[0] ? imageInput.files[0].name : '';
        });

        uploadImageBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            if (!file) { showToast('Please select an image.', 'warning'); return; }
            if (!currentUser) return;
            uploadImageBtn.disabled = true;
            uploadImageBtn.textContent = 'Uploading…';
            try {
                const imageUrl = await uploadImageToCloudinary(file);
                await db.collection('files').add({
                    name: file.name,
                    size: file.size,
                    url: imageUrl,
                    type: 'image',
                    uid: currentUser.uid,
                    email: currentUser.email,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                imageInput.value = '';
                imageFileName.textContent = '';
                showToast('Image uploaded successfully!', 'success');
            } catch (err) {
                showToast('Upload failed: ' + err.message, 'error');
            } finally {
                uploadImageBtn.disabled = false;
                uploadImageBtn.textContent = 'Upload';
            }
        });

        // ============================================================
        // 14. DOCUMENT UPLOAD (Chunking)
        // ============================================================
        const CHUNK_SIZE = 600 * 1024;

        function generateFileId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
        }

        function updateProgress(percent) {
            docProgressBar.value = percent;
            docProgressText.textContent = percent + '%';
            if (percent >= 100) {
                setTimeout(() => {
                    docProgressWrap.classList.remove('show');
                    docProgressBar.value = 0;
                    docProgressText.textContent = '0%';
                }, 1500);
            } else {
                docProgressWrap.classList.add('show');
            }
        }

        documentInput.addEventListener('change', () => {
            docFileName.textContent = documentInput.files[0] ? documentInput.files[0].name : '';
        });

        uploadDocumentBtn.addEventListener('click', async () => {
            const file = documentInput.files[0];
            if (!file) { showToast('Please select a document.', 'warning'); return; }
            if (!currentUser) return;

            uploadDocumentBtn.disabled = true;
            uploadDocumentBtn.textContent = 'Uploading…';

            if (file.size <= CHUNK_SIZE) {
                try {
                    const base64Data = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });
                    await db.collection('files').add({
                        name: file.name,
                        size: file.size,
                        url: base64Data,
                        type: 'document',
                        uid: currentUser.uid,
                        email: currentUser.email,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        totalChunks: 1
                    });
                    documentInput.value = '';
                    docFileName.textContent = '';
                    showToast('Document uploaded successfully!', 'success');
                    uploadDocumentBtn.disabled = false;
                    uploadDocumentBtn.textContent = 'Upload Doc';
                    return;
                } catch (err) {
                    showToast('Upload failed: ' + err.message, 'error');
                    uploadDocumentBtn.disabled = false;
                    uploadDocumentBtn.textContent = 'Upload Doc';
                    return;
                }
            }

            try {
                const fileId = generateFileId();
                const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
                const fileBuffer = await file.arrayBuffer();

                await db.collection('files').doc(fileId).set({
                    id: fileId,
                    name: file.name,
                    size: file.size,
                    type: 'document',
                    totalChunks: totalChunks,
                    status: 'uploading',
                    uid: currentUser.uid,
                    email: currentUser.email,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                for (let i = 0; i < totalChunks; i++) {
                    const start = i * CHUNK_SIZE;
                    const end = Math.min(start + CHUNK_SIZE, file.size);
                    const chunkData = new Uint8Array(fileBuffer.slice(start, end));
                    const firestoreBlob = firebase.firestore.Blob.fromUint8Array(chunkData);

                    await db.collection('fileChunks').add({
                        fileId: fileId,
                        chunkIndex: i,
                        totalChunks: totalChunks,
                        data: firestoreBlob,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    const percent = Math.round(((i + 1) / totalChunks) * 100);
                    updateProgress(percent);
                }

                await db.collection('files').doc(fileId).update({
                    status: 'completed',
                    completedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                documentInput.value = '';
                docFileName.textContent = '';
                showToast(`Large file uploaded! (${totalChunks} chunks)`, 'success');
                updateProgress(100);

            } catch (err) {
                console.error('Chunk upload error:', err);
                showToast('Upload failed: ' + err.message, 'error');
            } finally {
                uploadDocumentBtn.disabled = false;
                uploadDocumentBtn.textContent = 'Upload Doc';
            }
        });

        // ============================================================
        // 15. DOWNLOAD CHUNKED FILE
        // ============================================================
        window.downloadChunkedFile = async function(fileId) {
            try {
                const docRef = db.collection('files').doc(fileId);
                const metaSnap = await docRef.get();

                if (!metaSnap || (typeof metaSnap.exists === 'function' ? !metaSnap.exists() : !metaSnap.data)) {
                    showToast('File metadata not found.', 'error');
                    return;
                }

                const meta = metaSnap.data();
                const totalChunks = meta.totalChunks || 0;
                if (totalChunks === 0) {
                    showToast('Invalid file: no chunks found.', 'error');
                    return;
                }

                showToast('Downloading file… please wait.', 'info');

                const chunksSnap = await db.collection('fileChunks')
                    .where('fileId', '==', fileId)
                    .orderBy('chunkIndex', 'asc')
                    .get();

                if (chunksSnap.empty) {
                    showToast('No chunks found for this file.', 'error');
                    return;
                }

                const chunks = [];
                let totalSize = 0;
                chunksSnap.forEach(doc => {
                    const data = doc.data();
                    const chunkBlob = data.data;
                    if (chunkBlob) {
                        const chunkArray = chunkBlob.toUint8Array ? chunkBlob.toUint8Array() : new Uint8Array(
                        chunkBlob);
                        chunks.push(chunkArray);
                        totalSize += chunkArray.length;
                    }
                });

                if (chunks.length !== totalChunks) {
                    showToast(`Warning: Expected ${totalChunks} chunks, found ${chunks.length}.`, 'warning');
                }

                const fullArray = new Uint8Array(totalSize);
                let offset = 0;
                for (const chunk of chunks) {
                    fullArray.set(chunk, offset);
                    offset += chunk.length;
                }

                const blob = new Blob([fullArray], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = meta.name || 'downloaded_file';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 5000);

                showToast('File downloaded successfully!', 'success');

            } catch (err) {
                console.error('Download error:', err);
                showToast('Download failed: ' + err.message, 'error');
            }
        };

        // ============================================================
        // 16. WORK MANAGEMENT (Global — distributes to all users)
        // ============================================================
        (function setDefaultDate() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            workDate.value = `${yyyy}-${mm}-${dd}`;
        })();

        addWorkBtn.addEventListener('click', addWork);
        workName.addEventListener('keydown', e => { if (e.key === 'Enter') addWork(); });
        workAmount.addEventListener('keydown', e => { if (e.key === 'Enter') addWork(); });

        async function addWork() {
            if (!currentUser) return;
            const dateVal = workDate.value;
            const name = workName.value.trim();
            const amount = parseFloat(workAmount.value);
            if (!dateVal || !name || isNaN(amount) || amount <= 0) {
                showToast('Please fill all fields with valid values.', 'warning');
                return;
            }

            addWorkBtn.disabled = true;
            addWorkBtn.textContent = 'Adding…';

            try {
                const usersSnapshot = await db.collection('users').get();
                if (usersSnapshot.empty) {
                    throw new Error('No users found.');
                }

                const earningsMap = {};
                const batch = db.batch();
                let totalEarnings = 0;
                usersSnapshot.forEach(doc => {
                    const data = doc.data();
                    const percent = data.percentage || 100;
                    const earning = amount * (percent / 100);
                    earningsMap[doc.id] = earning;
                    totalEarnings += earning;
                    const currentBalance = data.balance || 0;
                    const newBalance = currentBalance + earning;
                    batch.update(doc.ref, { balance: newBalance });
                });

                const workRef = db.collection('works').doc();
                batch.set(workRef, {
                    amount: amount,
                    workName: name,
                    date: new Date(dateVal),
                    earnings: earningsMap,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    createdBy: currentUser.uid,
                    createdByEmail: currentUser.email
                });

                await batch.commit();

                workName.value = '';
                workAmount.value = '';
                showToast(`Work added! Distributed $${totalEarnings.toFixed(2)} to all users.`, 'success');
            } catch (err) {
                console.error(err);
                showToast('Failed to add work: ' + err.message, 'error');
            } finally {
                addWorkBtn.disabled = false;
                addWorkBtn.textContent = 'Add Work';
            }
        }

        async function deleteWorkAndAdjustBalance(workId) {
            const workRef = db.collection('works').doc(workId);
            const workSnap = await workRef.get();
            if (!workSnap.exists) throw new Error('Work entry not found.');
            const workData = workSnap.data();
            const earningsMap = workData.earnings || {};

            const batch = db.batch();
            for (const [userId, earning] of Object.entries(earningsMap)) {
                if (earning === 0) continue;
                const userRef = db.collection('users').doc(userId);
                const userSnap = await userRef.get();
                if (!userSnap.exists) continue;
                const currentBalance = userSnap.data().balance || 0;
                const newBalance = Math.max(0, currentBalance - earning);
                batch.update(userRef, { balance: newBalance });
            }
            batch.delete(workRef);
            await batch.commit();
        }

        // ============================================================
        // 17. UTILITY
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // 18. KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (modal.classList.contains('open')) {
                    if (modalResolve) modalResolve(false);
                    closeModal();
                }
            }
        });

        console.log('🚀 Rokon Workspace v7 — Fixed percentage calculation & email display in settings');
    </script>
