<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Support Chat · CodeCureBD</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1785180242/a6xbhrnjvb33c5ic6yyr.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>

    <style>
        /* ============================================================
                   GLOBAL RESET & BASE
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0066FF;
            --primary-dark: #0047CC;
            --primary-light: #E8F0FE;
            --primary-gradient: linear-gradient(135deg, #0066FF 0%, #8B5CF6 100%);
            --bg-body: #f0f4f9;
            --bg-chat: #f8fafc;
            --bg-white: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --border-light: rgba(0, 0, 0, 0.06);
            --shadow-sm: 0 1px 6px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 15px 50px rgba(0, 0, 0, 0.10);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --radius-full: 9999px;
            --transition: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-body);
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* ============================================================
                   PAGE WRAPPER
                   ============================================================ */
        .page-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
            padding: 0 16px;
        }

        /* ============================================================
                   MAIN CHAT SECTION
                   ============================================================ */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 16px 0;
        }

        .chat-full-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            position: relative;
        }

        /* ============================================================
                   MESSENGER WRAP
                   ============================================================ */
        .messenger-wrap {
            display: flex;
            flex-direction: column;
            flex: 1;
            width: 100%;
            min-height: 0;
            height: 100%;
            background: var(--bg-white);
            overflow: hidden;
            position: relative;
        }

        /* ============================================================
                   CHAT HEADER
                   ============================================================ */
        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-light);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            z-index: 5;
            position: relative;
        }

        .chat-header .chat-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.25rem;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(0, 102, 255, 0.30);
            position: relative;
        }

        .chat-header .chat-avatar .online-ring {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 16px;
            height: 16px;
            background: #34C759;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(52, 199, 89, 0.25);
        }

        .chat-header .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header .chat-info .name {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-dark);
            line-height: 1.3;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header .chat-info .name .verified-badge {
            background: var(--primary);
            color: #fff;
            font-size: 0.55rem;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .chat-header .chat-info .status {
            font-size: 0.78rem;
            color: #059669;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
            font-weight: 500;
        }

        .chat-header .chat-info .status .dot {
            width: 8px;
            height: 8px;
            background: #34C759;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.40;
                transform: scale(0.85);
            }
        }

        .chat-header .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-header .header-actions button {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-header .header-actions button:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        /* ============================================================
                   CHAT MESSAGES AREA
                   ============================================================ */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(0, 102, 255, 0.02), transparent 60%), var(--bg-chat);
            scroll-behavior: smooth;
            position: relative;
            min-height: 200px;
        }

        /* Date separator */
        .date-separator {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 18px 0 14px;
            gap: 16px;
        }

        .date-separator::before,
        .date-separator::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0, 0, 0, 0.06);
            max-width: 80px;
        }

        .date-separator span {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 16px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-light);
            letter-spacing: 0.03em;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
        }

        /* Message row */
        .msg-row {
            display: flex;
            flex-direction: column;
            width: fit-content;
            max-width: min(82%, 520px);
            min-width: 0;
            animation: fadeUp 0.30s cubic-bezier(0.22, 1, 0.36, 1);
            margin-bottom: 2px;
        }

        .msg-row.sent {
            align-self: flex-end;
            align-items: flex-end;
            margin-left: auto;
        }
        .msg-row.received {
            align-self: flex-start;
            align-items: flex-start;
            margin-right: auto;
            max-width: min(88%, 560px);
        }

        /* Message bubble */
        .chat-msg {
            display: block;
            width: max-content;
            max-width: min(82vw, 520px) !important;
            min-width: 48px;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.55;
            word-break: normal !important;
            overflow-wrap: anywhere;
            word-wrap: break-word;
            white-space: pre-wrap;
            position: relative;
            box-sizing: border-box;
        }

        .msg-row.sent .chat-msg {
            background: var(--primary-gradient);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 14px rgba(0, 102, 255, 0.20);
        }

        .msg-row.received .chat-msg {
            background: var(--bg-white);
            color: var(--text-dark);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            padding: 11px 18px;
        }

        .chat-msg .msg-text {
            display: inline;
            white-space: pre-wrap;
            word-break: normal !important;
            overflow-wrap: break-word;
        }

        /* Image in message */
        .chat-msg .msg-img-wrap {
            margin: 0 0 4px;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            max-width: 260px;
            position: relative;
            display: block;
            transition: transform 0.25s ease;
            background: #f1f5f9;
        }

        .chat-msg .msg-img-wrap:hover img {
            transform: scale(1.02);
        }

        .chat-msg .msg-img-wrap::after {
            content: '\f00e';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.50);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            opacity: 0;
            transition: opacity 0.2s;
            backdrop-filter: blur(4px);
        }

        .chat-msg .msg-img-wrap:hover::after {
            opacity: 1;
        }

        .chat-msg .msg-img-wrap img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.25s ease;
        }

        .chat-msg.img-only {
            padding: 4px;
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
        }

        .chat-msg.img-only .msg-img-wrap {
            margin: 0;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
        }

        /* Message meta (time + status) */
        .msg-meta {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            padding: 0 4px;
            font-size: 0.62rem;
            font-weight: 500;
            color: var(--text-light);
            line-height: 1;
            letter-spacing: 0.01em;
            user-select: none;
        }

        .msg-row.sent .msg-meta {
            justify-content: flex-end;
        }
        .msg-row.received .msg-meta {
            justify-content: flex-start;
        }

        .msg-meta .msg-status {
            font-size: 0.7rem;
            letter-spacing: -1px;
            margin-left: 2px;
        }

        .msg-meta .msg-status.read {
            color: var(--primary);
        }
        .msg-meta .msg-status.unread {
            color: var(--text-light);
            opacity: 0.7;
        }

        /* ============================================================
                   SCROLL TO BOTTOM BUTTON
                   ============================================================ */
        .scroll-bottom-btn {
            position: absolute;
            bottom: 100px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
            color: var(--primary);
            font-size: 1rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
        }

        .scroll-bottom-btn.show {
            display: flex;
            animation: fadeUp 0.25s ease;
        }

        .scroll-bottom-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 28px rgba(0, 102, 255, 0.25);
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .scroll-bottom-btn .new-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #FF3B30;
            color: #fff;
            font-size: 0.6rem;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(255, 59, 48, 0.35);
        }

        .scroll-bottom-btn .new-count.show {
            display: flex;
        }

        /* ============================================================
                   QUICK REPLIES
                   ============================================================ */
        .quick-replies {
            display: flex;
            gap: 8px;
            padding: 8px 20px 12px;
            overflow-x: auto;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.60);
            backdrop-filter: blur(8px);
            border-top: 1px solid var(--border-light);
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .quick-replies::-webkit-scrollbar {
            display: none;
        }

        .quick-replies button {
            flex-shrink: 0;
            background: var(--bg-white);
            border: 1.5px solid rgba(0, 102, 255, 0.10);
            color: var(--primary);
            font-size: 0.78rem;
            font-weight: 600;
            padding: 7px 16px;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
        }

        .quick-replies button:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(0, 102, 255, 0.12);
        }

        .quick-replies button:active {
            transform: scale(0.96);
        }

        /* ============================================================
                   CHAT INPUT
                   ============================================================ */
        .chat-input-wrap {
            display: flex;
            gap: 12px;
            padding: 12px 20px 16px;
            border-top: 1px solid var(--border-light);
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            flex-shrink: 0;
            align-items: flex-end;
        }

        .chat-input-wrap .input-wrapper {
            flex: 1;
            display: flex;
            gap: 6px;
            align-items: flex-end;
            background: #f1f5f9;
            border-radius: var(--radius-full);
            border: 2px solid transparent;
            padding: 4px 6px 4px 18px;
            transition: all 0.25s ease;
            min-height: 50px;
        }

        .chat-input-wrap .input-wrapper:focus-within {
            border-color: var(--primary);
            background: var(--bg-white);
            box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.08);
        }

        .chat-input-wrap .input-wrapper textarea {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            outline: none;
            min-width: 0;
            resize: none;
            max-height: 120px;
            line-height: 1.5;
            font-family: inherit;
            color: var(--text-dark);
        }

        .chat-input-wrap .input-wrapper textarea::placeholder {
            color: var(--text-light);
            opacity: 1;
        }

        /* Image preview inside input */
        .chat-input-wrap .image-preview {
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(0, 102, 255, 0.06);
            border-radius: var(--radius-sm);
            padding: 3px 8px 3px 3px;
            margin-right: 2px;
            flex-shrink: 0;
            animation: fadeUp 0.2s ease;
            border: 1px solid rgba(0, 102, 255, 0.10);
            margin-bottom: 2px;
        }

        .chat-input-wrap .image-preview.show {
            display: flex;
        }

        .chat-input-wrap .image-preview img {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border-light);
        }

        .chat-input-wrap .image-preview .remove-preview {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px;
            border-radius: 50%;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-input-wrap .image-preview .remove-preview:hover {
            color: #FF3B30;
            background: rgba(255, 59, 48, 0.08);
        }

        /* File button (icon only) */
        .chat-input-wrap .file-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 8px;
            transition: var(--transition);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-bottom: 2px;
            position: relative;
        }

        .chat-input-wrap .file-btn:hover {
            color: var(--primary);
            background: rgba(0, 102, 255, 0.08);
        }

        .chat-input-wrap .file-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .chat-input-wrap .file-btn input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .chat-input-wrap .file-btn .file-badge {
            position: absolute;
            top: 0;
            right: 0;
            width: 10px;
            height: 10px;
            background: #34C759;
            border-radius: 50%;
            border: 2px solid #fff;
            display: none;
        }

        .chat-input-wrap .file-btn .file-badge.show {
            display: block;
        }

        /* Send button */
        .chat-input-wrap .send-btn {
            border-radius: 50%;
            width: 50px;
            height: 50px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 1.15rem;
            flex-shrink: 0;
            box-shadow: 0 4px 18px rgba(0, 102, 255, 0.30);
            position: relative;
        }

        .chat-input-wrap .send-btn:hover:not(:disabled) {
            transform: scale(1.06);
            box-shadow: 0 6px 26px rgba(0, 102, 255, 0.40);
        }

        .chat-input-wrap .send-btn:active:not(:disabled) {
            transform: scale(0.94);
        }

        .chat-input-wrap .send-btn:disabled {
            opacity: 0.50;
            transform: none !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }

        .chat-input-wrap .send-btn .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        .chat-input-wrap .send-btn.loading .spinner {
            display: block;
        }
        .chat-input-wrap .send-btn.loading i {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
                   EMPTY STATE
                   ============================================================ */
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex-direction: column;
            gap: 10px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            color: var(--text-light);
        }

        .empty-state .empty-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 102, 255, 0.06), rgba(139, 92, 246, 0.06));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }

        .empty-state .empty-icon i {
            font-size: 2rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .empty-state .empty-title {
            font-weight: 700;
            color: var(--text-dark);
            font-size: 1.05rem;
        }

        .empty-state .empty-desc {
            font-size: 0.85rem;
            color: var(--text-light);
            max-width: 280px;
            line-height: 1.6;
        }

        /* ============================================================
                   SKELETON LOADING
                   ============================================================ */
        .skeleton-msg {
            height: 54px;
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            border-radius: 16px;
            margin-bottom: 10px;
            animation: shimmer 1.4s ease-in-out infinite;
        }

        .skeleton-msg.sent {
            align-self: flex-end;
            width: 55%;
            border-bottom-right-radius: 4px;
        }
        .skeleton-msg.received {
            align-self: flex-start;
            width: 65%;
            border-bottom-left-radius: 4px;
        }
        .skeleton-msg.short {
            width: 40%;
        }
        .skeleton-msg.long {
            width: 75%;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        /* ============================================================
                   LOADING OVERLAY (full-screen)
                   ============================================================ */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 24px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-overlay .loader-ring {
            width: 64px;
            height: 64px;
            border-radius: 50%;

<body>

    <!-- ============================================================

    <!-- ============================================================

        <button type="button" class="lb-close" id="lbClose" aria-label="Close preview">&times;</button>
        <img id="lbImage" src="#" alt="Full size preview" />
    </div>

    <!-- ============================================================
    TOAST CONTAINER
    ============================================================ -->
    <div id="toast-container"></div>


    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        // ================================================================
        //  1. FIREBASE CONFIG (from index.html)
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD-RHTu4TNjlEdH3M7O6-1HVaniVCPMEyI",
            authDomain: "rokon-workspace.firebaseapp.com",
            projectId: "rokon-workspace",
            storageBucket: "rokon-workspace.firebasestorage.app",
            messagingSenderId: "118826238702",
            appId: "1:118826238702:web:1917db220805b2012a69ff"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ================================================================
        //  2. CLOUDINARY CONFIG (from index.html)
        // ================================================================
        const CLOUDINARY_CLOUD_NAME = "zmoyykj7";
        const CLOUDINARY_UPLOAD_PRESET = "rokon_preset";

        // ================================================================
        //  3. DOM REFS
        // ================================================================
        const loadingOverlay = document.getElementById('loadingOverlay');
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');
        const fileInput = document.getElementById('fileInput');
        const fileBtn = document.getElementById('fileBtn');
        const fileBadge = document.getElementById('fileBadge');
        const imagePreview = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');
        const removePreviewBtn = document.getElementById('removePreview');
        const scrollBottomBtn = document.getElementById('scrollBottomBtn');
        const newMsgCountEl = document.getElementById('newMsgCount');
        const imgLightbox = document.getElementById('imgLightbox');
        const lbImage = document.getElementById('lbImage');
        const lbClose = document.getElementById('lbClose');
        const refreshBtn = document.getElementById('refreshBtn');
        const printBtn = document.getElementById('printBtn');
        const toastContainer = document.getElementById('toast-container');

        // ================================================================
        //  4. STATE
        // ================================================================
        let currentUser = null;
        let conversationId = null;
        let unsubMessages = null;
        let pendingImageFile = null;
        let userNearBottom = true;
        let pendingNewCount = 0;
        let lastMsgCount = 0;
        let isInitialLoad = true;
        let sendInProgress = false;

        // ================================================================
        //  5. TOAST SYSTEM
        // ================================================================
        function showToast(message, type = 'success') {
            if (!toastContainer) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle'
            };
            toast.innerHTML = `<i class="fas ${icons[type] || icons.success}"></i> ${message}`;
            toastContainer.appendChild(toast);

            // Auto-dismiss
            const timer = setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 400);
            }, 4800);

            // Allow manual dismiss
            toast.addEventListener('click', () => {
                clearTimeout(timer);
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 400);
            });
        }

        // ================================================================
        //  6. LOADING OVERLAY
        // ================================================================
        function hideLoadingOverlay() {
            loadingOverlay.classList.add('hidden');
        }

        function showLoadingOverlay(text = 'Connecting…', sub = 'Please wait') {
            loadingOverlay.querySelector('.loader-text').textContent = text;
            loadingOverlay.querySelector('.loader-sub').textContent = sub;
            loadingOverlay.classList.remove('hidden');
        }

        // ================================================================
        //  7. SET LOADING STATE FOR SEND BUTTON
        // ================================================================
        function setSendLoading(loading) {
            if (loading) {
                chatSendBtn.classList.add('loading');
                chatSendBtn.disabled = true;
            } else {
                chatSendBtn.classList.remove('loading');
                chatSendBtn.disabled = false;
            }
        }

        // ================================================================
        //  8. AUTO-RESIZE TEXTAREA
        // ================================================================
        function autoResizeTextarea() {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
        }
        chatInput.addEventListener('input', autoResizeTextarea);

        // Enter = send, Shift+Enter = new line
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.requestSubmit();
            }
        });

        // ================================================================
        //  9. QUICK REPLIES
        // ================================================================
        document.querySelectorAll('#quickReplies button').forEach(btn => {
            btn.addEventListener('click', () => {
                const text = btn.dataset.text || '';
                if (!text) return;
                chatInput.value = text;
                autoResizeTextarea();
                chatInput.focus();
                // Scroll to the end of text
                chatInput.setSelectionRange(text.length, text.length);
            });
        });

        // ================================================================
        //  10. IMAGE PREVIEW & FILE HANDLING
        // ================================================================
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast('Please select an image file.', 'warning');
                fileInput.value = '';
                return;
            }
            if (file.size > 10 * 1024 * 1024) {
                showToast('Image must be less than 10MB.', 'warning');
                fileInput.value = '';
                return;
            }

            pendingImageFile = file;
            const reader = new FileReader();
            reader.onload = (ev) => {
                previewImg.src = ev.target.result;
                imagePreview.classList.add('show');
                fileBadge.classList.add('show');
                // Change icon color to indicate success
                fileBtn.querySelector('i').style.color = '#34C759';
            };
            reader.readAsDataURL(file);
        });

        removePreviewBtn.addEventListener('click', clearImagePreview);

        function clearImagePreview() {
            pendingImageFile = null;
            imagePreview.classList.remove('show');
            previewImg.src = '#';
            fileInput.value = '';
            fileBadge.classList.remove('show');
            fileBtn.querySelector('i').style.color = '';
        }

        // ================================================================
        //  11. SCROLL HELPERS
        // ================================================================
        function isNearBottom(threshold = 80) {
            return chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight < threshold;
        }

        function scrollToBottom(smooth = true) {
            chatMessages.scrollTo({
                top: chatMessages.scrollHeight,
                behavior: smooth ? 'smooth' : 'auto'
            });
            userNearBottom = true;
            pendingNewCount = 0;
            newMsgCountEl.classList.remove('show');
            scrollBottomBtn.classList.remove('show');
        }

        chatMessages.addEventListener('scroll', () => {
            userNearBottom = isNearBottom();
            if (userNearBottom) {
                pendingNewCount = 0;
                newMsgCountEl.classList.remove('show');
                scrollBottomBtn.classList.remove('show');
            } else if (lastMsgCount > 0) {
                scrollBottomBtn.classList.add('show');
            }
        });

        scrollBottomBtn.addEventListener('click', () => scrollToBottom(true));

        // ================================================================
        //  12. DATE HELPERS
        // ================================================================
        function getDateLabel(date) {
            if (!date || isNaN(date.getTime())) return '';
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const msgDay = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const diffDays = Math.round((today - msgDay) / 86400000);
            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) {
                return date.toLocaleDateString('en-US', { weekday: 'long' });
            }
            return date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
            });
        }

        function isImageUrl(str) {
            if (!str) return false;
            return /^https?:\/\/.+\.(jpg|jpeg|png|gif|webp|svg|bmp|ico)(\?.*)?$/i.test(str.trim()) ||
                str.includes('res.cloudinary.com');
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function parseMessageContent(content) {
            const raw = content || '';
            const lines = raw.split('\n');
            let textParts = [];
            let imageUrl = null;

            lines.forEach(line => {
                const t = line.trim();
                if (isImageUrl(t)) {
                    imageUrl = t;
                } else if (t) {
                    textParts.push(line);
                }
            });

            if (!imageUrl && isImageUrl(raw.trim())) {
                imageUrl = raw.trim();
                textParts = [];
            }

            return { text: textParts.join('\n'), imageUrl };
        }

        // ================================================================
        //  13. LIGHTBOX
        // ================================================================
        window.openImageLightbox = function(url) {
            if (!url) return;
            lbImage.src = url;
            imgLightbox.classList.add('open');
            document.body.style.overflow = 'hidden';
        };

        function closeLightbox() {
            imgLightbox.classList.remove('open');
            lbImage.src = '';
            document.body.style.overflow = '';
        }

        lbClose.addEventListener('click', (e) => { e.stopPropagation();
            closeLightbox(); });
        imgLightbox.addEventListener('click', (e) => {
            if (e.target === imgLightbox) closeLightbox();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && imgLightbox.classList.contains('open')) closeLightbox();
        });

        // ================================================================
        //  14. RENDER MESSAGES
        // ================================================================
        function renderMessages(msgs) {
            if (!msgs || msgs.length === 0) {
                chatMessages.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon"><i class="fas fa-comments"></i></div>
                            <div class="empty-title">No messages yet</div>
                            <div class="empty-desc">Say hello or pick a quick reply below to start chatting with support.</div>
                        </div>
                    `;
                scrollBottomBtn.classList.remove('show');
                lastMsgCount = 0;
                return;
            }

            const wasNearBottom = userNearBottom || lastMsgCount === 0;
            const grew = msgs.length > lastMsgCount;
            lastMsgCount = msgs.length;

            let html = '';
            let lastDateKey = '';

            msgs.forEach(m => {
                const isSent = m.fromUserId === currentUser?.uid;
                const ts = m.timestamp?.toDate?.() || null;
                const dateKey = ts ? ts.toDateString() : '';
                const dateLabel = ts ? getDateLabel(ts) : '';

                if (dateLabel && dateKey !== lastDateKey) {
                    html += `<div class="date-separator"><span>${dateLabel}</span></div>`;
                    lastDateKey = dateKey;
                }

                const time = ts ?
                    ts.toLocaleString('en-US', { hour: '2-digit', minute: '2-digit' }) :
                    '';

                let statusHtml = '';
                if (isSent) {
                    const read = !!m.read;
                    statusHtml = `<span class="msg-status ${read ? 'read' : 'unread'}">${read ? '✓✓' : '✓'}</span>`;
                }

                const { text, imageUrl } = parseMessageContent(m.content || '');
                let contentHtml = '';
                if (imageUrl) {
                    contentHtml +=
                        `<div class="msg-img-wrap" onclick="window.openImageLightbox('${escapeHtml(imageUrl)}')"><img src="${escapeHtml(imageUrl)}" alt="Attachment" loading="lazy" /></div>`;
                }
                if (text) {
                    contentHtml += `<span class="msg-text">${escapeHtml(text)}</span>`;
                }
                if (!contentHtml) {
                    contentHtml = '<span class="msg-text" style="opacity:0.5;">(empty)</span>';
                }

                const imgOnly = imageUrl && !text ? ' img-only' : '';

                html += `
                        <div class="msg-row ${isSent ? 'sent' : 'received'}">
                            <div class="chat-msg${imgOnly}">${contentHtml}</div>
                            <div class="msg-meta">
                                <span class="msg-time">${time}</span>
                                ${statusHtml}
                            </div>
                        </div>
                    `;
            });

            chatMessages.innerHTML = html;

            if (wasNearBottom) {
                scrollToBottom(false);
            } else if (grew) {
                const newCount = msgs.length - (lastMsgCount - (grew ? 1 : 0));
                pendingNewCount += Math.max(1, newCount);
                newMsgCountEl.textContent = pendingNewCount > 9 ? '9+' : pendingNewCount;
                newMsgCountEl.classList.add('show');
                scrollBottomBtn.classList.add('show');
            }
        }

        // ================================================================
        //  15. SKELETON LOADING
        // ================================================================
        function showSkeletons() {
            chatMessages.innerHTML = `
                    <div class="skeleton-msg received long"></div>
                    <div class="skeleton-msg sent short"></div>
                    <div class="skeleton-msg received" style="width:50%;"></div>
                    <div class="skeleton-msg sent" style="width:60%;"></div>
                    <div class="skeleton-msg received" style="width:45%;"></div>
                `;
        }

        function showErrorState(errorMessage) {
            const existingMsgs = chatMessages.querySelectorAll('.chat-msg, .msg-row');
            if (existingMsgs.length > 0) {
                const banner = document.createElement('div');
                banner.className = 'empty-state';
                banner.style.cssText =
                    'padding:12px 16px;background:#fef2f2;border-radius:12px;margin-bottom:10px;color:#991b1b;font-size:0.85rem;flex-direction:row;gap:12px;height:auto;';
                banner.innerHTML = `
                        <i class="fas fa-exclamation-triangle" style="font-size:1.1rem;opacity:0.7;"></i>
                        <span style="flex:1;">${errorMessage || 'Error loading messages.'}</span>
                        <button class="retry-btn" style="padding:6px 16px;font-size:0.75rem;margin:0;background:#991b1b;color:#fff;border:none;border-radius:40px;cursor:pointer;font-weight:600;">Retry</button>
                    `;
                banner.querySelector('.retry-btn').addEventListener('click', () => {
                    banner.remove();
                    initChat(currentUser);
                });
                chatMessages.prepend(banner);
            } else {
                chatMessages.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon"><i class="fas fa-exclamation-circle" style="-webkit-text-fill-color:#ef4444;"></i></div>
                            <div class="empty-title">Couldn’t load messages</div>
                            <div class="empty-desc">${errorMessage || 'Please check your connection and try again.'}</div>
                            <button class="retry-btn" onclick="window.location.reload()" style="margin-top:12px;background:var(--primary-gradient);color:#fff;border:none;padding:10px 24px;border-radius:40px;cursor:pointer;font-weight:600;font-size:0.88rem;box-shadow:0 4px 14px rgba(0,102,255,0.25);">Retry</button>
                        </div>
                    `;
            }
        }

        // ================================================================
        //  16. CLOUDINARY UPLOAD
        // ================================================================
        async function uploadImageToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

            const response = await fetch(
                `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                }
            );

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || 'Cloudinary upload failed');
            }

            const data = await response.json();
            if (!data.secure_url) {
                throw new Error('Cloudinary did not return a secure URL');
            }
            return data.secure_url;
        }

        // ================================================================
        //  17. CHAT INIT
        // ================================================================
        async function initChat(user) {
            if (!user) return;
            currentUser = user;
            conversationId = `conv_${user.uid}_admin`;

            if (unsubMessages) {
                unsubMessages();
                unsubMessages = null;
            }

            showSkeletons();
            lastMsgCount = 0;
            pendingNewCount = 0;
            scrollBottomBtn.classList.remove('show');
            newMsgCountEl.classList.remove('show');

            try {
                await user.getIdToken(true);
            } catch (tokenErr) {
                console.warn('Token refresh failed:', tokenErr);
            }

            const handleSnapshot = (snapshot) => {
                const msgs = [];
                snapshot.forEach(d => {
                    const data = d.data();
                    if (data.conversationId === conversationId || !data.conversationId) {
                        msgs.push({ id: d.id, ...data });
                    }
                });
                msgs.sort((a, b) => {
                    const ta = a.timestamp?.toDate?.()?.getTime() || 0;
                    const tb = b.timestamp?.toDate?.()?.getTime() || 0;
                    return ta - tb;
                });

                if (isInitialLoad) {
                    isInitialLoad = false;
                    hideLoadingOverlay();
                }

                renderMessages(msgs);

                // Mark admin messages as read
                const unreadAdminMsgs = msgs.filter(m => m.fromUserId === 'admin' && !m.read);
                if (unreadAdminMsgs.length > 0) {
                    unreadAdminMsgs.forEach(async (m) => {
                        try {
                            await db.collection('messages').doc(m.id).update({
                                read: true,
                                readAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        } catch (err) {
                            console.warn('Failed to mark message as read:', err);
                        }
                    });
                }

                // If there are messages and we're near bottom, scroll
                if (msgs.length > 0 && userNearBottom) {
                    scrollToBottom(false);
                }
            };

            const handleError = (error) => {
                console.error('Snapshot error:', error?.code, error?.message);
                if (isInitialLoad) {
                    isInitialLoad = false;
                    hideLoadingOverlay();
                }
                const errorMsg = error?.message || 'Could not load messages.';
                showErrorState(errorMsg);
                showToast('⚠️ ' + errorMsg, 'error');
            };

            // Try participants query first, then fallback
            try {
                const q1 = db.collection('messages').where('participants', 'array-contains', user.uid);
                unsubMessages = q1.onSnapshot(handleSnapshot, (error) => {
                    console.warn('Participants query failed, trying conversationId…', error?.code);
                    const q2 = db.collection('messages').where('conversationId', '==', conversationId);
                    unsubMessages = q2.onSnapshot(handleSnapshot, (error2) => {
                        console.warn('conversationId failed, trying toUserId…', error2?.code);
                        const q3 = db.collection('messages').where('toUserId', '==', user.uid);
                        unsubMessages = q3.onSnapshot(handleSnapshot, handleError);
                    });
                });
            } catch (err) {
                console.error('Init chat error:', err);
                hideLoadingOverlay();
                showErrorState('Failed to connect to chat.');
            }
        }

        // ================================================================
        //  18. SEND MESSAGE
        // ================================================================
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (sendInProgress) return;

            const text = chatInput.value.trim();
            const hasFile = !!pendingImageFile;

            if (!text && !hasFile) {
                showToast('Please type a message or attach an image.', 'warning');
                return;
            }
            if (!currentUser) {
                showToast('Please sign in first.', 'warning');
                return;
            }
            if (!conversationId) {
                showToast('Conversation not ready. Please refresh.', 'error');
                return;
            }

            sendInProgress = true;
            setSendLoading(true);

            let imageUrl = null;

            try {
                // Upload image if present
                if (hasFile) {
                    imageUrl = await uploadImageToCloudinary(pendingImageFile);
                    clearImagePreview();
                    showToast('Image uploaded ✓', 'success');
                }

                // Build final content
                let finalContent = text;
                if (imageUrl) {
                    finalContent = text ? (text + '\n' + imageUrl) : imageUrl;
                }

                // Send message
                await db.collection('messages').add({
                    conversationId: conversationId,
                    fromUserId: currentUser.uid,
                    toUserId: 'admin',
                    content: finalContent,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    read: false,
                    participants: [currentUser.uid, 'admin']
                });

                chatInput.value = '';
                autoResizeTextarea();
                chatInput.focus();
                userNearBottom = true;

                // Force scroll after send
                setTimeout(() => scrollToBottom(true), 100);

            } catch (err) {
                console.error('Send error:', err);
                showToast('Error: ' + err.message, 'error');
                // If image upload failed, restore the preview
                if (hasFile && pendingImageFile) {
                    // already have preview
                }
            } finally {
                sendInProgress = false;
                setSendLoading(false);
                if (pendingImageFile) clearImagePreview();
            }
        });

        // ================================================================
        //  19. AUTH STATE
        // ================================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                // Show loading overlay while connecting
                showLoadingOverlay('Connecting to support…', 'Please wait a moment');
                await initChat(user);
            } else {
                // Not signed in — redirect to login
                window.location.href = 'index.html';
            }
        });

        // ================================================================
        //  20. REFRESH & PRINT
        // ================================================================
        refreshBtn.addEventListener('click', () => {
            if (currentUser) {
                showLoadingOverlay('Refreshing…', 'Please wait');
                isInitialLoad = true;
                if (unsubMessages) {
                    unsubMessages();
                    unsubMessages = null;
                }
                initChat(currentUser);
                showToast('Refreshed ✓', 'success');
            }
        });

        printBtn.addEventListener('click', () => {
            window.print();
        });

        // ================================================================
        //  21. CLEANUP
        // ================================================================
        window.addEventListener('beforeunload', () => {
            if (unsubMessages) unsubMessages();
        });

        // ================================================================
        //  22. CONSOLE
        // ================================================================
        console.log('💬 Support Chat — Modern UI with Cloudinary upload');
        console.log('📦 Cloudinary cloud:', CLOUDINARY_CLOUD_NAME);
        console.log('🔐 Firebase project:', firebaseConfig.projectId);
    </script>

</body>
</html>
